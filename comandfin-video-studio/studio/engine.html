<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>COMandFIN Video Engine</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ============================================================================
   COMandFIN VIDEO ENGINE
   One deterministic renderer for 16:9 long-form (1920x1080) and 9:16 Shorts /
   Reels (1080x1920). Every frame = f(segment, time). The project's
   storyboard (project.json) + transcript.json are injected as window.PROJECT.
   Segments:  teaser | body | end
   ========================================================================== */
const C = document.getElementById('c'), X = C.getContext('2d');
let P, W, H, V, L;                      // project, width, height, vertical?, layout
const B = { navy:'#091D39', navy2:'#13305A', gold:'#C89A2D', goldL:'#F2D58C', green:'#10B07F', greenD:'#0A8A63',
            red:'#D93A2F', paper:'#F7F8FB', ink:'#0F1B2D', muted:'#5B6B82', line:'#E3E8EF', white:'#FFFFFF' };
const F = 'Inter, "DejaVu Sans", Arial, sans-serif';
const AV = new Image();

/* ---------------- helpers ---------------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-p,3), eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const bo=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const pr=(t,a,d=0.5,e=eo)=>e(clamp((t-a)/d));
const S=(l,s)=>V?s:l;                         // pick long / short value
function font(sz,w=700){X.font=`${w} ${sz}px ${F}`;}
function tw(s,sz,w=700){font(sz,w);return X.measureText(s).width;}
function txt(s,x,y,sz,{w=700,c=B.ink,a='left',bl='middle',al=1}={}){X.save();X.globalAlpha*=al;font(sz,w);X.fillStyle=c;X.textAlign=a;X.textBaseline=bl;X.fillText(s,x,y);X.restore();}
function wrap(s,maxW,sz,w=700){font(sz,w);const out=[];let line='';for(const word of String(s).split(' ')){const tst=line?line+' '+word:word;if(X.measureText(tst).width>maxW&&line){out.push(line);line=word;}else line=tst;}if(line)out.push(line);return out;}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r);}
function card(x,y,w,h,{fill=B.white,r=18,shadow=true,stroke=null}={}){
  if(shadow){X.save();X.shadowColor='rgba(9,29,57,0.16)';X.shadowBlur=30;X.shadowOffsetY=10;X.fillStyle=fill;rr(x,y,w,h,r);X.fill();X.restore();}
  X.fillStyle=fill;rr(x,y,w,h,r);X.fill();if(stroke){X.strokeStyle=stroke;X.lineWidth=2;X.stroke();}
}
function pill(x,y,label,sz,{bg=B.navy,c=B.white,pad=S(22,26),h=null,a='left',w=null}={}){
  const ww=w||tw(label,sz,800)+pad*2, hh=h||sz*1.9, bx=a==='center'?x-ww/2:a==='right'?x-ww:x;
  X.fillStyle=bg;rr(bx,y-hh/2,ww,hh,hh/2);X.fill();txt(label,bx+ww/2,y+1,sz,{w:800,c,a:'center'});return ww;
}
function inAt(t,at,fn,d=0.45){const p=pr(t,at,d);if(p<=0)return;X.save();X.globalAlpha*=clamp(p*1.6);X.translate(0,(1-p)*S(26,34));fn(p);X.restore();}
function popAt(cx,cy,t,at,fn,d=0.45){const p=clamp((t-at)/d);if(p<=0)return;X.save();X.globalAlpha*=clamp(p*2);const s=bo(p);X.translate(cx,cy);X.scale(s,s);X.translate(-cx,-cy);fn();X.restore();}
function richLine(str,x,y,sz,{w=800,c=B.navy,hl=[],hc=B.gold,a='left'}={}){ // highlights words found in hl[]
  font(sz,w);const words=str.split(' ');let total=X.measureText(str).width;let cx=a==='center'?x-total/2:x;
  for(let i=0;i<words.length;i++){const wd=words[i]+(i<words.length-1?' ':'');const isH=hl.some(h=>h&&words[i].toLowerCase().replace(/[^\w₹%.]/g,'').includes(h.toLowerCase()));
    txt(wd,cx,y,sz,{w,c:isH?hc:c});cx+=X.measureText(wd).width;}
}

/* ---------------- background & brand ---------------- */
function background(t){
  X.fillStyle=B.paper;X.fillRect(0,0,W,H);
  X.strokeStyle='rgba(9,29,57,0.045)';X.lineWidth=1;X.beginPath();
  const g=S(48,54);for(let x=0;x<=W;x+=g){X.moveTo(x+.5,0);X.lineTo(x+.5,H);}for(let y=0;y<=H;y+=g){X.moveTo(0,y+.5);X.lineTo(W,y+.5);}X.stroke();
  // drifting brand motion lines (as in the intro)
  const lines=[[0.08,0.2,180,B.green],[0.85,0.14,140,B.gold],[0.7,0.9,220,B.green],[0.15,0.82,160,B.gold],[0.5,0.06,120,B.green]];
  lines.forEach(([fx,fy,len,col],i)=>{const x=((fx*W+t*(18+i*6))%(W+300))-150,y=fy*H;X.strokeStyle=col;X.globalAlpha=0.55;X.lineWidth=S(5,6);X.lineCap='round';X.beginPath();X.moveTo(x,y);X.lineTo(x+len,y);X.stroke();X.globalAlpha=1;});
}
function wordmark(x,y,sz,a='left',dark=false){
  const parts=[['COM',dark?B.white:B.navy],['and',B.gold],['FIN',dark?B.white:B.navy]];font(sz,900);
  const total=parts.reduce((s,[p])=>s+X.measureText(p).width,0);let cx=a==='center'?x-total/2:a==='right'?x-total:x;
  parts.forEach(([p,c])=>{txt(p,cx,y,sz,{w:900,c});font(sz,900);cx+=X.measureText(p).width;});
  X.fillStyle=B.gold;X.fillRect(a==='center'?x-total/2:a==='right'?x-total:x,y+sz*0.62,total,Math.max(3,sz*0.07));
  return total;
}
function brandBar(t){
  if(V){wordmark(W/2,118,58,'center');if(P.topic&&!INTEASER)pill(W/2,212,P.topic.toUpperCase(),26,{bg:B.navy,a:'center'});}
  else{wordmark(70,64,40);if(P.topic)pill(W-70,64,P.topic.toUpperCase(),22,{bg:B.navy,a:'right'});}
}
function progress(t,dur){X.fillStyle='rgba(9,29,57,0.08)';X.fillRect(0,H-8,W,8);X.fillStyle=B.gold;X.fillRect(0,H-8,W*clamp(t/dur),8);}
function avatar(t){
  const env=P.transcript.envelope||[];const e=env[Math.floor(t*25)]||0;const sm=(env[Math.floor(t*25)-1]||0)*0.5+e*0.5;
  const {x,y,r}=L.avatar;
  X.save();X.globalAlpha=0.35*sm+0.08;X.fillStyle=B.green;X.beginPath();X.arc(x,y,r+10+sm*S(22,26),0,7);X.fill();X.restore();
  X.save();X.beginPath();X.arc(x,y,r,0,7);X.closePath();const g=X.createLinearGradient(x,y-r,x,y+r);g.addColorStop(0,'#AFC3C7');g.addColorStop(1,'#8FA6AA');X.fillStyle=g;X.fill();X.clip();
  if(AV.complete&&AV.naturalWidth)X.drawImage(AV,x-r*1.05,y-r*1.0,r*2.1,r*2.1);X.restore();
  X.strokeStyle=B.gold;X.lineWidth=S(5,6);X.beginPath();X.arc(x,y,r,0,7);X.stroke();
  const nx=L.avatar.nameX,ny=L.avatar.nameY;
  if(nx!=null){const al=L.avatar.nameAlign;card(al==='right'?nx-S(250,300):nx,ny-S(34,40),S(250,300),S(68,80),{r:12,fill:B.navy,shadow:false});
    const bx=al==='right'?nx-S(250,300)+S(18,22):nx+S(18,22);txt('CA Ankit Bajaj',bx,ny-S(10,12),S(22,27),{w:800,c:B.white});txt('Founder, COMandFIN',bx,ny+S(16,18),S(16,19),{w:600,c:B.goldL});}
}

/* ---------------- captions ---------------- */
let CAP=[],INTEASER=false;
function buildCaptions(){
  const maxWords=V?3:9, maxChars=V?18:58;CAP=[];
  for(const seg of P.transcript.segments){let cur=[];
    for(const w of seg.words){cur.push(w);const s=cur.map(x=>x.w).join(' ');const endPunct=/[.,?!;:]$/.test(w.w);
      if(cur.length>=maxWords||s.length>=maxChars||(endPunct&&cur.length>=(V?1:4))){CAP.push(cur);cur=[];}}
    if(cur.length)CAP.push(cur);}
  CAP.forEach((c,i)=>{c.s=c[0].s;c.e=c[c.length-1].e;const nx=CAP[i+1];c.hold=nx&&nx[0].s-c.e<0.6?nx[0].s:c.e+0.25;});
}
function captions(t){
  if(P.captions===false)return;const c=CAP.find(c=>t>=c.s&&t<c.hold);if(!c)return;
  const sz=L.cap.size, y=L.cap.y;
  const words=c.map(w=>w.w.replace(/^["“]|["”]$/g,''));const str=words.join(' ');
  if(V){ // big social-style captions, active word in gold, slight pop
    const lines=wrap(str.toUpperCase(),L.cap.maxW-sz*0.5,sz,900);const lh=sz*1.18;const p=pr(t,c.s,0.18,bo);
    X.save();X.translate(W/2,y);X.scale(0.85+0.15*p,0.85+0.15*p);X.translate(-W/2,-y);
    let wi=0;lines.forEach((ln,li)=>{const ly=y+(li-(lines.length-1)/2)*lh;font(sz,900);let cx=W/2-(X.measureText(ln).width+sz*0.22*(ln.split(' ').length-1))/2;
      ln.split(' ').forEach((wd,k,arr)=>{const w=c[wi];const active=w&&t>=w.s&&t<w.e+0.05;const piece=wd+(k<arr.length-1?' ':'');
        X.lineJoin='round';X.strokeStyle=B.navy;X.lineWidth=sz*0.2;font(sz,900);X.textBaseline='middle';X.textAlign='left';X.strokeText(wd,cx,ly);
        txt(wd,cx,ly,sz,{w:900,c:active?B.goldL:B.white});font(sz,900);cx+=X.measureText(piece).width+sz*0.22;wi++;});});
    X.restore();
  } else {
    const lines=wrap(str,L.cap.maxW,sz,700);const lh=sz*1.3;const boxW=Math.max(...lines.map(l=>tw(l,sz,700)))+60, boxH=lines.length*lh+24;
    X.fillStyle='rgba(9,29,57,0.88)';rr(W/2-boxW/2,y-boxH/2,boxW,boxH,14);X.fill();
    let wi=0;lines.forEach((ln,li)=>{const ly=y-boxH/2+12+lh/2+li*lh;font(sz,700);let cx=W/2-X.measureText(ln).width/2;
      ln.split(' ').forEach((wd,k,arr)=>{const w=c[wi];const active=w&&t>=w.s&&t<w.e+0.05;const piece=wd+(k<arr.length-1?' ':'');
        txt(wd,cx,ly,sz,{w:700,c:active?B.goldL:B.white});font(sz,700);cx+=X.measureText(piece).width;wi++;});});
  }
}

/* ---------------- scene toolkit ---------------- */
function heading(s,b,t,t0){ if(!s.heading)return 0;
  const sz=S(54,56);const lines=wrap(s.heading,b.w-40,sz,900);const p=pr(t,t0,0.5);
  lines.forEach((ln,i)=>richLine(ln,V?b.x+b.w/2:b.x,b.y+30+i*sz*1.15,sz,{w:900,hl:s.hl||[],a:V?'center':'left'}));
  const ux=V?b.x+b.w/2-110:b.x;X.fillStyle=B.gold;X.fillRect(ux,b.y+30+lines.length*sz*1.15-sz*0.35,220*p,6);
  return 30+lines.length*sz*1.15+S(40,50);
}
function times(s,items){ // default reveal times: spread across the first 70% of the scene
  const n=items.length,a=s.start+0.6,z=s.start+(s.end-s.start)*0.7;return items.map((it,i)=>it.at??(n<=1?a:lerp(a,z,i/(n-1))));
}
function icon(kind,x,y,r,col){
  X.fillStyle=col;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.strokeStyle=B.white;X.lineWidth=r*0.22;X.lineCap='round';X.lineJoin='round';X.beginPath();
  if(kind==='check'){X.moveTo(x-r*0.45,y);X.lineTo(x-r*0.1,y+r*0.35);X.lineTo(x+r*0.5,y-r*0.35);}
  else if(kind==='x'){X.moveTo(x-r*0.38,y-r*0.38);X.lineTo(x+r*0.38,y+r*0.38);X.moveTo(x+r*0.38,y-r*0.38);X.lineTo(x-r*0.38,y+r*0.38);}
  X.stroke();
}

/* ---------------- scene types ---------------- */
const SCENE={
 title(s,b,t){
  const cx=b.x+b.w/2,cy=b.y+b.h/2;const t0=s.start;
  if(s.kicker)popAt(cx,cy-S(150,230),t,t0+0.1,()=>pill(cx,cy-S(150,230),s.kicker.toUpperCase(),S(26,30),{bg:B.green,a:'center'}));
  const sz=s.size||S(92,96);const lines=wrap(s.heading,b.w-S(100,40),sz,900);
  lines.forEach((ln,i)=>inAt(t,t0+0.3+i*0.15,()=>richLine(ln,cx,cy-S(30,60)+(i-(lines.length-1)/2)*sz*1.12,sz,{w:900,hl:s.hl||[],a:'center'})));
  const ly=cy-S(30,60)+(lines.length/2)*sz*1.12+S(20,30);X.fillStyle=B.gold;const lw=S(360,320)*pr(t,t0+0.6,0.6);X.fillRect(cx-lw/2,ly,lw,7);
  if(s.sub){const sl=wrap(s.sub,b.w-120,S(38,40),600);sl.forEach((l,i)=>inAt(t,t0+0.9,()=>txt(l,cx,ly+S(60,70)+i*S(48,52),S(38,40),{w:600,c:B.muted,a:'center'})));}
 },
 bullets(s,b,t){
  const hh=heading(s,b,t,s.start);const at=times(s,s.items);const sz=s.size||S(46,50);
  const kind=s.style||'check',col=kind==='x'?B.red:kind==='num'?B.gold:B.green;
  const rowsH=s.items.map(it=>Math.max(wrap(typeof it==='string'?it:it.text,b.w-S(130,110),sz,700).length*sz*1.25,sz*1.3)+S(44,48));
  let y=b.y+hh+Math.max(0,(b.h-hh-rowsH.reduce((a,c)=>a+c,0))/2-S(30,20));
  s.items.forEach((it,i)=>{const text=typeof it==='string'?it:it.text;const lines=wrap(text,b.w-S(130,110),sz,700);const rowH=rowsH[i];
    const yy=y;inAt(t,at[i],()=>{card(b.x,yy-10,b.w,rowH-14,{r:16});
      if(kind==='num'){X.fillStyle=B.gold;X.beginPath();X.arc(b.x+S(52,50),yy+rowH/2-17,S(26,28),0,7);X.fill();txt(String(i+1),b.x+S(52,50),yy+rowH/2-15,S(28,30),{w:900,c:B.navy,a:'center'});}
      else icon(kind,b.x+S(52,50),yy+rowH/2-17,S(26,28),col);
      lines.forEach((l,k)=>richLine(l,b.x+S(100,96),yy+rowH/2-17+(k-(lines.length-1)/2)*sz*1.25,sz,{w:700,c:B.ink,hl:it.hl||s.hl||[]}));});
    y+=rowH;});
 },
 stat(s,b,t){
  const cx=b.x+b.w/2,cy=b.y+b.h/2-S(40,60);const at=s.at??s.start+0.4;const p=pr(t,at,1.3,eio);
  if(s.heading)inAt(t,s.start,()=>txt(s.heading,cx,b.y+S(60,80),S(46,50),{w:800,c:B.muted,a:'center'}));
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2,r1=S(250,280)*pr(t,at+1.1,0.5),r2=r1+S(30,34);X.strokeStyle=i%2?B.gold:B.green;X.lineWidth=6;X.globalAlpha=1-pr(t,at+1.6,0.6);X.beginPath();X.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);X.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);X.stroke();X.globalAlpha=1;}
  const v=s.value*p;const dec=s.decimals??(Number.isInteger(s.value)?0:1);const str=(s.prefix||'')+v.toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+(s.suffix||'');
  popAt(cx,cy,t,at,()=>txt(str,cx,cy,s.size||S(190,170),{w:900,c:s.color||B.gold,a:'center'}));
  if(s.label)inAt(t,at+0.5,()=>wrap(s.label,b.w-80,S(50,52),800).forEach((l,i)=>txt(l,cx,cy+S(140,140)+i*S(60,62),S(50,52),{w:800,c:B.navy,a:'center'})));
  if(s.sub)inAt(t,at+0.9,()=>wrap(s.sub,b.w-120,S(34,38),600).forEach((l,i)=>txt(l,cx,cy+S(215,270)+i*S(44,48),S(34,38),{w:600,c:B.muted,a:'center'})));
 },
 formula(s,b,t){
  let y0=b.y+heading(s,b,t,s.start);const parts=s.parts;const at=times(s,parts);const sz=S(50,50);
  if(!V){ // one row, auto-shrinking
    const pad=26,gap=18;let sc=1;const widths=()=>parts.map(p=>p.op?tw(p.text,sz*1.4*sc,900)+gap:tw(p.text,sz*sc,800)+pad*2*sc+gap);
    while(widths().reduce((a,b)=>a+b,0)>b.w&&sc>0.55)sc-=0.05;const ws=widths();let x=b.x+(b.w-ws.reduce((a,b)=>a+b,0))/2;const y=y0+(b.y+b.h-y0)/2-60;
    parts.forEach((p,i)=>{const w=ws[i]-gap,xx=x;popAt(xx+w/2,y,t,at[i],()=>{if(p.op)txt(p.text,xx+w/2,y,sz*1.4*sc,{w:900,c:B.gold,a:'center'});
      else{card(xx,y-62*sc,w,124*sc,{fill:p.result?B.navy:B.white,r:16,stroke:p.result?null:B.navy});txt(p.text,xx+w/2,y+2,sz*sc,{w:800,c:p.result?B.goldL:B.navy,a:'center'});}});x+=ws[i];});
    if(s.note)inAt(t,s.note_at??at[at.length-1]+0.8,()=>wrap(s.note,b.w-200,38,600).forEach((l,i)=>txt(l,b.x+b.w/2,y+160+i*48,38,{w:600,c:B.muted,a:'center'})));
  } else { // vertical stack
    const tot=parts.reduce((a,p)=>a+(p.op?70:wrap(p.text,b.w-120,sz,800).length*sz*1.2+58),0);let y=y0+Math.max(20,(b.y+b.h-y0-tot)/2-40);parts.forEach((p,i)=>{const yy=y;if(p.op){popAt(b.x+b.w/2,yy+30,t,at[i],()=>txt(p.text,b.x+b.w/2,yy+30,60,{w:900,c:B.gold,a:'center'}));y+=70;}
      else{const lines=wrap(p.text,b.w-120,sz,800);const h=lines.length*sz*1.2+44;popAt(b.x+b.w/2,yy+h/2,t,at[i],()=>{card(b.x+40,yy,b.w-80,h,{fill:p.result?B.navy:B.white,r:18,stroke:p.result?null:B.navy});lines.forEach((l,k)=>txt(l,b.x+b.w/2,yy+22+sz*0.6+k*sz*1.2,sz,{w:800,c:p.result?B.goldL:B.navy,a:'center'}));});y+=h+14;}});
    if(s.note)inAt(t,s.note_at??at[at.length-1]+0.8,()=>wrap(s.note,b.w-80,34,600).forEach((l,i)=>txt(l,b.x+b.w/2,y+40+i*44,34,{w:600,c:B.muted,a:'center'})));
  }
 },
 calc(s,b,t){
  let y=b.y+heading(s,b,t,s.start);const at=times(s,s.rows);const sz=S(36,38);
  const winH=b.y+b.h-y;card(b.x,y-10,b.w,winH,{r:18});X.fillStyle=B.navy;rr(b.x,y-10,b.w,46,[18,18,0,0]);X.fill();
  [B.red,B.gold,B.green].forEach((c,i)=>{X.fillStyle=c;X.beginPath();X.arc(b.x+30+i*28,y+13,8,0,7);X.fill();});txt(s.window||'Calculation',b.x+b.w/2,y+13,22,{w:700,c:'#D5DEEA',a:'center'});
  y+=S(80,86);const rowH=s.rowH||(V?Math.min(150,(winH-110)/s.rows.length):Math.min(92,(winH-100)/s.rows.length));
  s.rows.forEach((r,i)=>{const yy=y+i*rowH;
    inAt(t,at[i],()=>{const lw=V?b.w-80:Math.min(560,b.w*0.42);
      X.fillStyle=r.hl?B.green:B.goldL;rr(b.x+40,yy-sz*0.85,lw,sz*1.7,10);X.fill();txt(r.label,b.x+60,yy,sz*0.92,{w:800,c:r.hl?B.white:B.navy});
      const vx=V?b.x+60:b.x+60+lw,vy=V?yy+sz*1.6:yy;const tp=clamp((t-at[i]-0.35)/Math.max(0.5,r.value.length*0.04));const shown=r.value.slice(0,Math.round(r.value.length*tp));
      if(tp>0){txt(V?'= '+shown:'=  '+shown,vx+(V?0:20),vy,sz*1.05,{w:800,c:r.hl?B.greenD:B.ink});}});});
 },
 table(s,b,t){
  let y=b.y+heading(s,b,t,s.start);const at=times(s,s.rows);const cols=s.cols,n=cols.length;const sz=s.size||S(32,30);

    inAt(t,1.2,()=>{pill(W/2-560,875,'LIKE',30,{bg:B.white,c:B.navy,a:'center',w:220});pill(W/2-310,875,'SHARE',30,{bg:B.white,c:B.navy,a:'center',w:220});
      pill(W/2+330,875,'SUBSCRIBE',30,{bg:B.red,a:'center',w:280});});
    txt('www.COMandFIN.com',W/2,1015,30,{w:700,c:B.goldL,a:'center',al:pr(t,1.6)});
  } else {
    wordmark(W/2,300,92,'center',true);txt('Finance. Practical. Daily.',W/2,410,40,{w:700,c:B.goldL,a:'center',al:pr(t,0.2)});
    popAt(W/2,760,t,0.2,()=>{const r=200;X.save();X.beginPath();X.arc(W/2,760,r,0,7);X.clip();X.fillStyle='#9FB4B8';X.fillRect(W/2-r,760-r,2*r,2*r);if(AV.complete)X.drawImage(AV,W/2-r*1.05,760-r,r*2.1,r*2.1);X.restore();X.strokeStyle=B.gold;X.lineWidth=10;X.beginPath();X.arc(W/2,760,r,0,7);X.stroke();});
    const items=[['LIKE',B.white,B.navy],['SHARE',B.white,B.navy],['SAVE',B.white,B.navy],['FOLLOW',B.red,B.white]];
    items.forEach(([l,bg,c],i)=>popAt(W/2,1080+i*120,t,0.5+i*0.18,()=>pill(W/2,1080+i*120,l,44,{bg,c,a:'center',w:520,h:96})));
    txt(P.endLine||'Follow COMandFIN for daily finance lessons',W/2,1620,34,{w:700,c:B.white,a:'center',al:pr(t,1.2)});
  }
}

/* ---------------- frame composition ---------------- */
function body(t){
  background(t);brandBar(t);
  const sc=(P.scenes||[]).find(s=>t>=s.start&&t<s.end);
  if(sc){const fade=Math.min(pr(t,sc.start,0.3),1-pr(t,sc.end-0.25,0.25));X.save();X.globalAlpha=clamp(fade);
    const k=ctaSqueeze(t)*0.3,cx=L.stage.x+L.stage.w/2,cy=L.stage.y;X.translate(cx,cy);X.scale(1-k,1-k);X.translate(-cx,-cy);
    (SCENE[sc.type]||SCENE.statement)(sc,L.stage,t);X.restore();}
  chapterCard(t);hookOverlay(t);avatar(t);captions(t);cta(t);progress(t,P.transcript.duration);
}
const SEG={
  body:{dur:()=>P.transcript.duration+0.3,draw:t=>body(t)},
  end:{dur:()=>P.endDur||(V?3.5:12),draw:t=>endScreen(t)},
  teaser:{dur:()=>(P.teaser?.clips||[]).reduce((a,c)=>a+(c[1]-c[0]),0),draw:t=>{
    let acc=0;for(const [i,c] of (P.teaser.clips||[]).entries()){const d=c[1]-c[0];if(t<acc+d||i===P.teaser.clips.length-1){const bt=c[0]+Math.min(t-acc,d-0.001);INTEASER=true;body(bt);INTEASER=false;teaserOverlay(t,i,t-acc,d);return;}acc+=d;}}},
};
function setup(project){
  P=project;V=P.format==='short';W=V?1080:1920;H=V?1920:1080;C.width=W;C.height=H;
  L=V?{stage:{x:60,y:300,w:960,h:1000},cap:{y:1440,size:76,maxW:940},avatar:{x:150,y:1640,r:84,nameX:250,nameY:1640,nameAlign:'left'}}
     :{stage:{x:110,y:150,w:1700,h:730},cap:{y:985,size:38,maxW:1420},avatar:{x:1810,y:975,r:66,nameX:null}};
  AV.src=P.avatarUrl;buildCaptions();return new Promise(r=>{if(AV.complete)r();else{AV.onload=r;AV.onerror=r;}});
}
// sound-effect cue list for the audio mixer
function events(){
  const ev=[];(P.scenes||[]).forEach(s=>{ev.push({t:s.start,k:'whoosh'});
    const lists=[s.items,s.rows,s.parts,s.bars,s.steps];lists.forEach(l=>{if(l)times(s,l).forEach(a=>ev.push({t:a,k:'pop'}));});});
  ctaTimes().forEach(c=>{ev.push({t:c.at,k:'whoosh'},{t:c.at+2.4,k:'click'},{t:c.at+3.5,k:'click'},{t:c.at+3.55,k:'ding'});});
  return ev.filter(e=>e.t>=0).sort((a,b)=>a.t-b.t);
}
window.ENGINE={setup,events,draw:(seg,t)=>{X.save();X.clearRect(0,0,W,H);SEG[seg].draw(t);X.restore();},duration:seg=>SEG[seg].dur()};
</script>
