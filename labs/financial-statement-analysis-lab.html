<style>
:root{
  --navy:#0b1f3a; --navy2:#132c52; --blue:#2563eb; --blue-light:#eaf1ff;
  --mint:#0fae83; --gold:#c99a2e; --red:#c0392b; --amber:#b8860b;

*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}

header.topbar .sub{font-size:11.5px;color:#b9c6e0;margin-top:2px;}
.record-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;}
.record-bar input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 8px;font-size:12px;width:110px;}

.mode-toggle button.active{background:var(--gold);color:#221a04;}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--navy2);padding:6px 14px;position:sticky;top:60px;z-index:49;box-shadow:0 2px 6px rgba(0,0,0,.08);}
nav.tabs button{background:none;border:none;color:#c8d3e8;font-size:12.3px;font-weight:600;padding:8px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;}
nav.tabs button:hover{background:rgba(255,255,255,.08);color:#fff;}

main{max-width:1320px;margin:0 auto;padding:20px;}
.tabpanel{display:none;}
.tabpanel.active{display:block;animation:fadein .15s ease;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,60,.04);}
.card h2{margin:0 0 4px;color:var(--navy);font-size:19px;}

.grid{display:grid;gap:14px;}

<script>
/* =====================================================================
   FINANCIAL STATEMENT ANALYSIS & RATIO ANALYSIS LEARNING LAB
   Single-file vanilla JS application. All figures in ₹ Lakhs unless noted.
===================================================================== */

/* ---------------------------------------------------------------------
   1. GLOBAL STATE
--------------------------------------------------------------------- */
const TABS = [
  {id:'dashboard',label:'Dashboard'},
  {id:'statements',label:'Financial Statements'},
  {id:'vertical',label:'Vertical Analysis'},
  {id:'horizontal',label:'Horizontal Analysis'},
  {id:'causeeffect',label:'Cause & Effect Simulator'},
  {id:'liquidity',label:'Liquidity Ratios'},
  {id:'activity',label:'Activity Ratios'},
  {id:'capstructure',label:'Capital Structure'},
  {id:'leverage',label:'Leverage Ratios'},
  {id:'profitability',label:'Profitability Ratios'},
  {id:'valuation',label:'Valuation Ratios'},
  {id:'dupont',label:'DuPont Analysis'},
  {id:'competitor',label:'Competitor Analysis'},
  {id:'practice',label:'Practice Lab'},
  {id:'casestudies',label:'Case Studies'},
  {id:'dataimport',label:'Data Import'},
  {id:'report',label:'Print / Report'}
];

let MODE = 'student'; // 'student' | 'teacher'
let CURRENT_TAB = 'dashboard';

// raw editable inputs for the primary company, Year 1 & Year 2
function blankYear(){
  return {
    revenue:0, cogs:0, opex:0, depreciation:0, interest:0, taxRate:30,
    cash:0, ar:0, inventory:0, otherCA:0,
    ppe:0, otherNCA:0,
    ap:0, std:0, otherCL:0,
    ltd:0, otherNCL:0, equity:0,
    shares:0, marketPrice:0, dividends:0
  };
}

let DATA = {
  meta:{company:'My Company', ticker:'', currency:'₹ Lakh'},
  year1: blankYear(),
  year2: blankYear()
};

// competitor companies (each holds only Year2-equivalent single-period data for comparison)
let COMPETITORS = {
  A:{name:'Company A', data: blankYear()},
  B:{name:'Company B', data: blankYear()},
  C:{name:'Company C', data: blankYear()}
};

// simulator holds a working copy of year2 that the student perturbs
let SIM = null;

/* ---------------------------------------------------------------------
   2. PRELOADED EXAMPLE COMPANIES
--------------------------------------------------------------------- */
const EXAMPLES = {
  stable:{
    label:'Stable Company (Mature FMCG-style)',
    year1:{revenue:10000,cogs:6200,opex:1800,depreciation:220,interest:250,taxRate:30,
      cash:600,ar:900,inventory:1100,otherCA:200,
      ppe:4200,otherNCA:400,
      ap:850,std:300,otherCL:250,
      ltd:1800,otherNCL:200,equity:0,
      shares:500,marketPrice:120,dividends:400},
    year2:{revenue:10800,cogs:6600,opex:1900,depreciation:240,interest:230,taxRate:30,
      cash:700,ar:950,inventory:1150,otherCA:220,
      ppe:4400,otherNCA:420,
      ap:880,std:280,otherCL:260,
      ltd:1700,otherNCL:210,equity:0,
      shares:500,marketPrice:132,dividends:430}
  },
  growth:{
    label:'High Growth Company (Tech/D2C-style)',
    year1:{revenue:4000,cogs:2200,opex:1400,depreciation:110,interest:80,taxRate:25,
      cash:900,ar:500,inventory:300,otherCA:150,
      ppe:1200,otherNCA:300,
      ap:400,std:100,otherCL:150,
      ltd:600,otherNCL:100,equity:0,
      shares:300,marketPrice:250,dividends:0},
    year2:{revenue:7200,cogs:3960,opex:2400,depreciation:170,interest:140,taxRate:25,
      cash:1100,ar:950,inventory:620,otherCA:200,
      ppe:1900,otherNCA:380,
      ap:700,std:250,otherCL:220,
      ltd:1100,otherNCL:150,equity:0,
      shares:320,marketPrice:410,dividends:0}
  },
  distressed:{
    label:'Financially Distressed Company',
    year1:{revenue:5000,cogs:3600,opex:1100,depreciation:230,interest:400,taxRate:30,
      cash:150,ar:800,inventory:1200,otherCA:100,
      ppe:2500,otherNCA:200,
      ap:900,std:700,otherCL:300,
      ltd:2200,otherNCL:150,equity:0,
      shares:400,marketPrice:35,dividends:0},
    year2:{revenue:4600,cogs:3550,opex:1150,depreciation:225,interest:480,taxRate:30,
      cash:60,ar:1050,inventory:1450,otherCA:120,
      ppe:2400,otherNCA:190,
      ap:1150,std:950,otherCL:340,
      ltd:2350,otherNCL:160,equity:0,
      shares:400,marketPrice:14,dividends:0}
  }
};
// backfill equity so that Assets = Liabilities + Equity exactly for preloaded examples
function balanceExampleEquity(y){
  const ca = y.cash+y.ar+y.inventory+y.otherCA;
  const nca = y.ppe+y.otherNCA;
  const totalAssets = ca+nca;
  const cl = y.ap+y.std+y.otherCL;
  const ncl = y.ltd+y.otherNCL;
  y.equity = totalAssets - (cl+ncl);
}
Object.values(EXAMPLES).forEach(ex=>{balanceExampleEquity(ex.year1);balanceExampleEquity(ex.year2);});

/* ---------------------------------------------------------------------
   3. DERIVATION ENGINE — everything downstream is computed, never hard-coded
--------------------------------------------------------------------- */
function computeDerived(y){
  const d = {...y};
  // Income statement
  d.grossProfit = d.revenue - d.cogs;
  d.ebitda = d.grossProfit - d.opex;
  d.depreciation = d.depreciation || 0;
  d.ebit = d.ebitda - d.depreciation;
  d.pbt = d.ebit - d.interest;
  d.tax = Math.max(0, d.pbt) * (d.taxRate/100);
  d.netIncome = d.pbt - d.tax;
  // Balance sheet
  d.totalCurrentAssets = d.cash + d.ar + d.inventory + d.otherCA;
  d.totalNonCurrentAssets = d.ppe + d.otherNCA;
  d.totalAssets = d.totalCurrentAssets + d.totalNonCurrentAssets;
  d.totalCurrentLiabilities = d.ap + d.std + d.otherCL;
  d.totalNonCurrentLiabilities = d.ltd + d.otherNCL;
  d.totalLiabilities = d.totalCurrentLiabilities + d.totalNonCurrentLiabilities;
  d.impliedEquity = d.totalAssets - d.totalLiabilities;
  d.balanceDiff = d.totalAssets - (d.totalLiabilities + d.equity);
  d.balanced = Math.abs(d.balanceDiff) < 0.5;
  // Market
  d.marketCap = d.shares * d.marketPrice;
  d.eps = d.shares>0 ? d.netIncome/d.shares : 0;
  d.bvps = d.shares>0 ? d.equity/d.shares : 0;
  d.dps = d.shares>0 ? d.dividends/d.shares : 0;
  d.workingCapital = d.totalCurrentAssets - d.totalCurrentLiabilities;
  return d;
}

function fmt(n,dec=2){
  if(n===undefined||n===null||isNaN(n)) return '—';
  const sign = n<0?'-':'';
  return sign + Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fmtCur(n,dec=1){ return '₹'+fmt(n,dec); }
function fmtPct(n,dec=1){ if(n===undefined||n===null||isNaN(n)) return '—'; return fmt(n,dec)+'%'; }
function fmtX(n,dec=2){ if(n===undefined||n===null||isNaN(n)) return '—'; return fmt(n,dec)+'x'; }
function safeDiv(a,b){ return b===0||b===undefined||b===null ? NaN : a/b; }
function dirArrow(delta){ if(delta===undefined||isNaN(delta)) return ''; if(delta>0.0001) return '↑'; if(delta<-0.0001) return '↓'; return '→'; }
function dirClass(delta){ if(delta===undefined||isNaN(delta)) return 'neu'; if(delta>0.0001) return 'pos'; if(delta<-0.0001) return 'neg'; return 'neu'; }

/* ---------------------------------------------------------------------
   4. LOCALSTORAGE PERSISTENCE
--------------------------------------------------------------------- */
function saveToStorage(){
  try{
    localStorage.setItem('fsalab_data', JSON.stringify(DATA));
    localStorage.setItem('fsalab_competitors', JSON.stringify(COMPETITORS));
    localStorage.setItem('fsalab_va_reasons', JSON.stringify(VA_REASONS||{}));
    localStorage.setItem('fsalab_ha_reasons', JSON.stringify(HA_REASONS||{}));
    localStorage.setItem('fsalab_record', JSON.stringify({
      student: byId('recStudent').value, id: byId('recId').value,
      course: byId('recCourse').value, instructor: byId('recInstructor').value
    }));
  }catch(e){}
}
function loadFromStorage(){
  try{
    const d = localStorage.getItem('fsalab_data');
    if(d) DATA = JSON.parse(d);
    const c = localStorage.getItem('fsalab_competitors');
    if(c) COMPETITORS = JSON.parse(c);
    const va = localStorage.getItem('fsalab_va_reasons');
    if(va) VA_REASONS = JSON.parse(va);
    const ha = localStorage.getItem('fsalab_ha_reasons');
    if(ha) HA_REASONS = JSON.parse(ha);
    const r = localStorage.getItem('fsalab_record');
    if(r){
      const rec = JSON.parse(r);
      byId('recStudent').value = rec.student||'';
      byId('recId').value = rec.id||'';
      byId('recCourse').value = rec.course||'';
      byId('recInstructor').value = rec.instructor||'';
    }
  }catch(e){}
}
function byId(id){ return document.getElementById(id); }

/* ---------------------------------------------------------------------
   5. RATIO DEFINITION ENGINE
   Each ratio: {key, name, unit('x'|'%'|'days'|'num'), formula string,
   calc(d)->{num,den,value}, interpret(value,d)->string, benchmark note}
   d = a computeDerived() object. Works for any single period (Year1/Year2/competitor).
--------------------------------------------------------------------- */
const RATIOS = {};

RATIOS.liquidity = [
  {key:'current', name:'Current Ratio', unit:'x',
   formula:'Current Assets / Current Liabilities',
   calc:d=>({num:d.totalCurrentAssets, den:d.totalCurrentLiabilities, value:safeDiv(d.totalCurrentAssets,d.totalCurrentLiabilities)}),
   interpret:v=> v<1 ? 'Current liabilities exceed current assets. The company may face short-term liquidity pressure.' :
                 v>2 ? 'Liquidity appears strong, although excessively high liquidity may indicate inefficient use of current assets.' :
                 'The company has a reasonable liquidity cushion for short-term obligations.'},
  {key:'quick', name:'Quick Ratio (Acid-Test)', unit:'x',
   formula:'(Cash + Accounts Receivable) / Current Liabilities',
   calc:d=>({num:d.cash+d.ar, den:d.totalCurrentLiabilities, value:safeDiv(d.cash+d.ar,d.totalCurrentLiabilities)}),
   interpret:v=> v<1 ? 'Excluding inventory, the company may struggle to meet short-term liabilities quickly.' : 'The company can cover short-term liabilities without relying on inventory liquidation.'},
  {key:'cash', name:'Cash Ratio', unit:'x',
   formula:'Cash / Current Liabilities',
   calc:d=>({num:d.cash, den:d.totalCurrentLiabilities, value:safeDiv(d.cash,d.totalCurrentLiabilities)}),
   interpret:v=> v<0.2 ? 'Cash alone covers a small fraction of current liabilities — reliance on collections/inventory sales is high.' : 'Cash reserves alone provide meaningful coverage of current liabilities.'},
  {key:'workingcapital', name:'Working Capital', unit:'num',
   formula:'Current Assets − Current Liabilities',
   calc:d=>({num:d.totalCurrentAssets, den:d.totalCurrentLiabilities, value:d.totalCurrentAssets-d.totalCurrentLiabilities}),
   interpret:v=> v<0 ? 'Negative working capital — current obligations exceed current resources.' : 'Positive working capital cushion available for operations.'},
  {key:'defensive', name:'Defensive Interval Ratio', unit:'days',
   formula:'(Cash + AR) / (Avg Daily Operating Expenses)',
   calc:d=>{const dailyOpex=(d.cogs+d.opex)/365; return {num:d.cash+d.ar, den:dailyOpex, value:safeDiv(d.cash+d.ar,dailyOpex)};},
   interpret:v=> v<30 ? 'The company could sustain operating expenses from liquid assets for less than a month without external financing.' : 'Liquid assets could sustain operations for a reasonable period without new financing.'}
];

RATIOS.activity = [
  {key:'invturn', name:'Inventory Turnover', unit:'x',
   formula:'COGS / Average Inventory',
   calc:(d,p)=>{const avg=p? (p.inventory+d.inventory)/2 : d.inventory; return {num:d.cogs, den:avg, value:safeDiv(d.cogs,avg)};},
   interpret:v=> v<3 ? 'Inventory is moving slowly, potentially indicating excess stock or weaker demand.' : 'Inventory is being converted to sales efficiently.'},
  {key:'recturn', name:'Receivables Turnover', unit:'x',
   formula:'Revenue / Average Accounts Receivable',
   calc:(d,p)=>{const avg=p? (p.ar+d.ar)/2 : d.ar; return {num:d.revenue, den:avg, value:safeDiv(d.revenue,avg)};},
   interpret:v=> v<6 ? 'Receivables turn over slowly — customers may be taking long to pay.' : 'Receivables are collected efficiently.'},
  {key:'payturn', name:'Payables Turnover', unit:'x',
   formula:'COGS / Average Accounts Payable',
   calc:(d,p)=>{const avg=p? (p.ap+d.ap)/2 : d.ap; return {num:d.cogs, den:avg, value:safeDiv(d.cogs,avg)};},
   interpret:v=> v>12 ? 'Payables are settled quickly — the company may be under-utilizing supplier credit as free financing.' : 'The company is making reasonable use of supplier credit.'},
  {key:'totassetturn', name:'Total Asset Turnover', unit:'x',
   formula:'Revenue / Average Total Assets',
   calc:(d,p)=>{const avg=p? (p.totalAssets+d.totalAssets)/2 : d.totalAssets; return {num:d.revenue, den:avg, value:safeDiv(d.revenue,avg)};},
   interpret:v=> v<0.7 ? 'Assets are generating relatively low revenue — asset utilization may be inefficient.' : 'Assets are being used efficiently to generate revenue.'},
  {key:'fixedassetturn', name:'Fixed Asset Turnover', unit:'x',
   formula:'Revenue / Average Net PP&E',
   calc:(d,p)=>{const avg=p? (p.ppe+d.ppe)/2 : d.ppe; return {num:d.revenue, den:avg, value:safeDiv(d.revenue,avg)};},
   interpret:v=> v<1.5 ? 'Fixed assets are generating comparatively low sales, which may signal excess capacity.' : 'Fixed assets are generating strong sales relative to their book value.'},
  {key:'wcturn', name:'Working Capital Turnover', unit:'x',
   formula:'Revenue / Average Working Capital',
   calc:(d,p)=>{const wc = d.totalCurrentAssets-d.totalCurrentLiabilities; const pwc = p? p.totalCurrentAssets-p.totalCurrentLiabilities : wc; const avg=(wc+pwc)/2; return {num:d.revenue, den:avg, value:safeDiv(d.revenue,avg)};},
   interpret:v=> isNaN(v)||v<0 ? 'Working capital is negative or near zero, making this ratio unstable to interpret.' : v>15 ? 'Revenue is being generated very efficiently relative to working capital deployed.' : 'A moderate amount of working capital supports each rupee of revenue.'},
  {key:'dio', name:'Days Inventory Outstanding (DIO)', unit:'days',
   formula:'365 / Inventory Turnover',
   calc:(d,p)=>{const avg=p? (p.inventory+d.inventory)/2 : d.inventory; const turn=safeDiv(d.cogs,avg); return {num:365, den:turn, value:safeDiv(365,turn)};},
   interpret:v=> v>90 ? 'Inventory sits for a long time before sale, tying up cash.' : 'Inventory converts to sales within a reasonable period.'},
  {key:'dso', name:'Days Sales Outstanding (DSO)', unit:'days',
   formula:'365 / Receivables Turnover',
   calc:(d,p)=>{const avg=p? (p.ar+d.ar)/2 : d.ar; const turn=safeDiv(d.revenue,avg); return {num:365, den:turn, value:safeDiv(365,turn)};},
   interpret:v=> v>60 ? 'Customers are taking longer to pay, potentially increasing working-capital requirements.' : 'Collections from customers happen within a reasonable window.'},
  {key:'dpo', name:'Days Payable Outstanding (DPO)', unit:'days',
   formula:'365 / Payables Turnover',
   calc:(d,p)=>{const avg=p? (p.ap+d.ap)/2 : d.ap; const turn=safeDiv(d.cogs,avg); return {num:365, den:turn, value:safeDiv(365,turn)};},
   interpret:v=> v<30 ? 'The company pays suppliers quickly, forgoing potential free financing from trade credit.' : 'The company is stretching payment terms to preserve cash.'},
  {key:'opcycle', name:'Operating Cycle', unit:'days',
   formula:'DIO + DSO',
   calc:(d,p)=>{
     const avgInv=p?(p.inventory+d.inventory)/2:d.inventory, avgAr=p?(p.ar+d.ar)/2:d.ar;
     const dio=safeDiv(365,safeDiv(d.cogs,avgInv)), dso=safeDiv(365,safeDiv(d.revenue,avgAr));
     return {num:dio, den:dso, value:dio+dso};},
   interpret:v=> v>150 ? 'Cash is tied up in the operating cycle for a long period, increasing financing needs.' : 'Cash converts back from inventory and receivables in a reasonable time.'},
  {key:'ccc', name:'Cash Conversion Cycle (CCC)', unit:'days',
   formula:'DIO + DSO − DPO',
   calc:(d,p)=>{
     const avgInv=p?(p.inventory+d.inventory)/2:d.inventory, avgAr=p?(p.ar+d.ar)/2:d.ar, avgAp=p?(p.ap+d.ap)/2:d.ap;
     const dio=safeDiv(365,safeDiv(d.cogs,avgInv)), dso=safeDiv(365,safeDiv(d.revenue,avgAr)), dpo=safeDiv(365,safeDiv(d.cogs,avgAp));
     return {num:dio+dso, den:dpo, value:(dio+dso)-dpo};},
   interpret:v=> v>90 ? 'A long cash conversion cycle means cash is locked up for an extended period, increasing reliance on external financing.' : v<0 ? 'A negative CCC means the company collects cash before it must pay suppliers — a favorable working-capital position.' : 'A moderate cash conversion cycle indicates reasonably efficient working-capital management.'}
];

RATIOS.capstructure = [
  {key:'debtratio', name:'Debt Ratio', unit:'x',
   formula:'Total Liabilities / Total Assets',
   calc:d=>({num:d.totalLiabilities, den:d.totalAssets, value:safeDiv(d.totalLiabilities,d.totalAssets)}),
   interpret:v=> v>0.6 ? 'A large share of assets is financed by debt, increasing financial risk.' : 'A conservative share of assets is financed by debt.'},
  {key:'de', name:'Debt-to-Equity Ratio', unit:'x',
   formula:'Total Liabilities / Shareholders\' Equity',
   calc:d=>({num:d.totalLiabilities, den:d.equity, value:safeDiv(d.totalLiabilities,d.equity)}),
   interpret:v=> v>2 ? 'Financial risk and fixed financing commitments appear elevated.' : v<0.5 ? 'The company relies conservatively on debt relative to equity.' : 'The company maintains a moderate balance of debt and equity financing.'},
  {key:'equityratio', name:'Equity Ratio', unit:'x',
   formula:'Shareholders\' Equity / Total Assets',
   calc:d=>({num:d.equity, den:d.totalAssets, value:safeDiv(d.equity,d.totalAssets)}),
   interpret:v=> v<0.3 ? 'Owners fund a relatively small portion of the asset base.' : 'Owners fund a substantial portion of the asset base, indicating lower leverage.'},
  {key:'ltdcap', name:'Long-term Debt-to-Capital Ratio', unit:'x',
   formula:'Long-term Debt / (Long-term Debt + Equity)',
   calc:d=>({num:d.ltd, den:d.ltd+d.equity, value:safeDiv(d.ltd,d.ltd+d.equity)}),
   interpret:v=> v>0.5 ? 'Long-term debt forms the majority of permanent capital, raising structural leverage.' : 'Long-term capital structure is weighted more toward equity.'},
  {key:'totdebtcap', name:'Total Debt-to-Capital Ratio', unit:'x',
   formula:'Total Debt / (Total Debt + Equity)',
   calc:d=>{const totDebt=d.std+d.ltd; return {num:totDebt, den:totDebt+d.equity, value:safeDiv(totDebt,totDebt+d.equity)};},
   interpret:v=> v>0.5 ? 'Debt makes up the majority of total capital employed.' : 'Equity makes up the majority of total capital employed.'},
  {key:'capitalization', name:'Capitalization Ratio', unit:'x',
   formula:'Long-term Debt / (Long-term Debt + Equity + Non-current Liabilities)',
   calc:d=>{const cap=d.ltd+d.equity+d.otherNCL; return {num:d.ltd, den:cap, value:safeDiv(d.ltd,cap)};},
   interpret:v=> v>0.4 ? 'Long-term debt represents a significant part of permanent capitalization.' : 'Long-term debt represents a modest part of permanent capitalization.'}
];

RATIOS.leverage = [
  {key:'finlev', name:'Financial Leverage (Equity Multiplier)', unit:'x',
   formula:'Total Assets / Shareholders\' Equity',
   calc:d=>({num:d.totalAssets, den:d.equity, value:safeDiv(d.totalAssets,d.equity)}),
   interpret:v=> v>3 ? 'The company is using a significant amount of leverage to fund assets, amplifying both returns and risk.' : 'The company uses a moderate amount of leverage to fund assets.'},
  {key:'intcov', name:'Interest Coverage Ratio', unit:'x',
   formula:'EBIT / Interest Expense',
   calc:d=>({num:d.ebit, den:d.interest, value:safeDiv(d.ebit,d.interest)}),
   interpret:v=> v<2 ? 'The company\'s ability to service interest from operating profit is weakening — financial distress risk.' : v<4 ? 'Interest coverage is adequate but leaves limited room for an earnings downturn.' : 'The company comfortably covers interest obligations from operating profit.'},
  {key:'cashintcov', name:'Cash Interest Coverage Ratio', unit:'x',
   formula:'(EBIT + Non-cash items) / Interest Expense',
   calc:d=>({num:d.ebit, den:d.interest, value:safeDiv(d.ebit,d.interest)}),
   interpret:v=> v<2 ? 'Cash-based coverage of interest is thin.' : 'Cash flow available comfortably covers interest payments.'}
];

RATIOS.profitability = [
  {key:'ebitdamargin', name:'EBITDA Margin', unit:'%',
   formula:'EBITDA / Revenue × 100',
   calc:d=>({num:d.ebitda, den:d.revenue, value:safeDiv(d.ebitda,d.revenue)*100}),
   interpret:v=> v<12 ? 'EBITDA margin is thin, leaving limited operating cash-generation cushion before depreciation, interest and tax.' : 'EBITDA margin indicates healthy core cash operating profitability before depreciation, interest and tax.'},
  {key:'gpm', name:'Gross Profit Margin', unit:'%',
   formula:'Gross Profit / Revenue × 100',
   calc:d=>({num:d.grossProfit, den:d.revenue, value:safeDiv(d.grossProfit,d.revenue)*100}),
   interpret:v=> v<20 ? 'Gross margin is thin, leaving little cushion after direct costs.' : 'Gross margin provides a healthy cushion after direct costs.'},
  {key:'opm', name:'Operating Profit Margin', unit:'%',
   formula:'EBIT / Revenue × 100',
   calc:d=>({num:d.ebit, den:d.revenue, value:safeDiv(d.ebit,d.revenue)*100}),
   interpret:v=> v<8 ? 'Core operations generate a modest profit margin before interest and tax.' : 'Core operations are generating a healthy operating margin.'},
  {key:'npm', name:'Net Profit Margin', unit:'%',
   formula:'Net Income / Revenue × 100',
   calc:d=>({num:d.netIncome, den:d.revenue, value:safeDiv(d.netIncome,d.revenue)*100}),
   interpret:v=> v<0 ? 'The company is posting a net loss on revenue.' : v<5 ? 'Net margin is thin after all costs, interest and tax.' : 'The company converts a healthy share of revenue into bottom-line profit.'},
  {key:'roa', name:'Return on Assets (ROA)', unit:'%',
   formula:'Net Income / Average Total Assets × 100',
   calc:(d,p)=>{const avg=p?(p.totalAssets+d.totalAssets)/2:d.totalAssets; return {num:d.netIncome, den:avg, value:safeDiv(d.netIncome,avg)*100};},
   interpret:v=> v<3 ? 'Assets are generating a low return, indicating inefficient use of the asset base or thin margins.' : 'Assets are generating a healthy return.'},
  {key:'roe', name:'Return on Equity (ROE)', unit:'%',
   formula:'Net Income / Average Equity × 100',
   calc:(d,p)=>{const avg=p?(p.equity+d.equity)/2:d.equity; return {num:d.netIncome, den:avg, value:safeDiv(d.netIncome,avg)*100};},
   interpret:v=> v<10 ? 'Return to shareholders is relatively modest.' : v>25 ? 'Return to shareholders is very high — verify whether this is driven by strong profitability or by high leverage.' : 'Return to shareholders is healthy.'},
  {key:'roce', name:'Return on Capital Employed (ROCE)', unit:'%',
   formula:'EBIT / (Total Assets − Current Liabilities) × 100',
   calc:d=>{const ce=d.totalAssets-d.totalCurrentLiabilities; return {num:d.ebit, den:ce, value:safeDiv(d.ebit,ce)*100};},
   interpret:v=> v<10 ? 'Capital employed is generating a modest pre-tax, pre-interest return.' : 'Capital employed is generating a strong operating return.'},
  {key:'roc', name:'Return on Capital', unit:'%',
   formula:'Net Income / (Debt + Equity) × 100',
   calc:d=>{const cap=d.std+d.ltd+d.equity; return {num:d.netIncome, den:cap, value:safeDiv(d.netIncome,cap)*100};},
   interpret:v=> v<8 ? 'Total capital deployed is generating a relatively low return.' : 'Total capital deployed is generating a solid return.'},
  {key:'opexratio', name:'Operating Expense Ratio', unit:'%',
   formula:'Operating Expenses / Revenue × 100',
   calc:d=>({num:d.opex, den:d.revenue, value:safeDiv(d.opex,d.revenue)*100}),

  {key:'taxrate', name:'Effective Tax Rate', unit:'%',
   formula:'Tax Expense / Profit Before Tax × 100',
   calc:d=>({num:d.tax, den:d.pbt, value:safeDiv(d.tax,d.pbt)*100}),

];

  {key:'dps', name:'Dividend per Share (DPS)', unit:'num',

  {key:'earnyield', name:'Earnings Yield', unit:'%',

const RATIO_CATEGORY_LABEL = {
  liquidity:'Liquidity Ratios', activity:'Activity / Efficiency Ratios', capstructure:'Capital Structure Ratios',
  leverage:'Leverage Ratios', profitability:'Profitability Ratios', valuation:'Valuation Ratios'
};

// "lower is better" flags used by competitor scorecard logic
const LOWER_IS_BETTER = new Set(['dio','dso','ccc','opcycle','debtratio','de','ltdcap','totdebtcap','capitalization','finlev','pe','opexratio']);

/* ---------------------------------------------------------------------
   6. GENERIC RATIO BLOCK RENDERER (used by every ratio-category tab)
--------------------------------------------------------------------- */
function renderRatioCategory(catKey){
  const defs = RATIOS[catKey];
  const d1 = computeDerived(DATA.year1), d2 = computeDerived(DATA.year2);
  let html = `<div class="card"><h2>${RATIO_CATEGORY_LABEL[catKey]}</h2>
    <p class="lead">Every figure below is calculated live from the Financial Statements tab. Edit the statements or use the Cause &amp; Effect Simulator to see these numbers move.</p>
    <div class="btnrow no-print">
      <button class="btn secondary" onclick="downloadRatioCategoryCSV('${catKey}')">⬇ Download ${RATIO_CATEGORY_LABEL[catKey]} (CSV)</button>
    </div>
    <div class="ratio-grid">`;
  defs.forEach(r=>{
    const c1 = r.calc(d1,null), c2 = r.calc(d2,d1);
    const delta = c2.value - c1.value;
    const unitFmt = v => r.unit==='%' ? fmtPct(v) : r.unit==='x' ? fmtX(v) : r.unit==='days' ? fmt(v,1)+' days' : fmtCur(v,1);
    html += `<div class="formula-block">
      <div class="fname">${r.name}</div>
      <div class="fformula">Formula: ${r.formula}</div>
      <div class="fcalc">Year 2 → ${fmt(c2.num,1)} / ${fmt(c2.den,1)}</div>
      <div class="fresult">${unitFmt(c2.value)}</div>
      <table style="margin-top:8px;font-size:12px;">
        <tr><td style="text-align:left">Year 1</td><td>${unitFmt(c1.value)}</td>
            <td style="text-align:left">Year 2</td><td>${unitFmt(c2.value)}</td>
            <td style="text-align:left">Change</td><td class="${dirClass(delta)}">${dirArrow(delta)} ${unitFmt(Math.abs(delta))}</td></tr>
      </table>
      <div class="finterpret">💡 ${r.interpret(c2.value,d2)}</div>
    </div>`;
  });
  html += `</div></div>`;
  return html;
}

function buildNav(){
  const nav = byId('tabNav');
  nav.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function switchTab(id){
  CURRENT_TAB = id;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  const main = byId('mainArea');
  main.innerHTML = `<div class="tabpanel active" id="panel-${id}"></div>`;
  const panel = byId('panel-'+id);
  RENDERERS[id](panel);
  window.scrollTo({top:0,behavior:'instant'});
}

function renderBalanceCheck(){
  const box = byId('balanceCheck');
  if(!box) return;
  const d1 = computeDerived(DATA.year1), d2 = computeDerived(DATA.year2);
  let html = '';
  [['Year 1',d1],['Year 2',d2]].forEach(([label,d])=>{
    if(d.balanced){
      html += `<div class="callout good">✓ <b>${label}: BALANCE SHEET BALANCED</b> — Assets ${fmtCur(d.totalAssets,1)} = Liabilities + Equity ${fmtCur(d.totalLiabilities+d.equity,1)}</div>`;
    }else{
      html += `<div class="callout risk">⚠ <b>${label}: BALANCE SHEET DOES NOT BALANCE</b> — Difference = Assets − (Liabilities + Equity) = ${fmtCur(d.balanceDiff,1)}. Adjust Shareholders' Equity or another line item.</div>`;
    }
  });
  box.innerHTML = html;
}

function updateField(year,key,val){
  DATA[year][key] = parseFloat(val)||0;
  saveToStorage();
  RENDERERS.statements(byId('panel-statements'));
}
function loadExample(name){
  const ex = EXAMPLES[name];
  DATA.year1 = {...ex.year1};

  DATA.meta.company = ex.label;
  saveToStorage();
  switchTab('statements');

const VA_BLANK_ROWS = new Set(['cogs','opex','tax']); // rows where Year-2 % is left blank for students (amounts always shown)
let VA_REASONS = {}; // rowKey -> reason text
let VA_ANSWERS = {}; // rowKey -> {pct} student-entered
let VA_CHECKED = false;

function vaRow(rowKey,label,k1,k2,base1,base2){
  const v1 = safeDiv(k1,base1)*100, v2 = safeDiv(k2,base2)*100;
  const isBlank = VA_BLANK_ROWS.has(rowKey);
  const amtCell = fmtCur(k2,1); // amount is always shown
  let pctCell;
  if(isBlank){
    const savedPct = VA_ANSWERS[rowKey]?.pct ?? '';
    const pctOk = VA_CHECKED ? Math.abs(parseFloat(savedPct)-v2) < 0.6 : null;
    pctCell = `<input type="number" step="any" style="width:70px;${VA_CHECKED?(pctOk?'border-color:#0fae83;background:#e6f8f1;':'border-color:#c0392b;background:#fceceb;'):''}" value="${savedPct}" oninput="VA_ANSWERS['${rowKey}']=Object.assign(VA_ANSWERS['${rowKey}']||{},{pct:this.value})">`;
    if(VA_CHECKED) pctCell += ` <span class="small-note">(ans: ${fmtPct(v2)})</span>`;
  } else {
    pctCell = fmtPct(v2);
  }
  const reasonVal = VA_REASONS[rowKey] || '';
  return `<tr><td style="text-align:left;"><input type="text" placeholder="Why did this change?" value="${reasonVal.replace(/"/g,'&quot;')}" style="width:100%;font-size:11.5px;" oninput="VA_REASONS['${rowKey}']=this.value"></td>
    <td style="text-align:left">${label}</td><td>${fmtCur(k1,1)}</td><td>${fmtPct(v1)}</td><td>${amtCell}</td><td>${pctCell}</td>
    <td class="${dirClass(v2-v1)}">${dirArrow(v2-v1)} ${fmtPct(Math.abs(v2-v1))} pts</td></tr>`;
}

const HORIZ_INTERPRET = {
  revenue:(chg)=> chg>0 ? 'Revenue growth is generally positive, but check whether it is profitable growth (margins) and cash-backed growth (receivables/CCC).' : 'A revenue decline warrants investigation into demand, pricing, or competitive pressure.',
  cogs:(chg)=> chg>0 ? 'Rising COGS is expected with growth, but if it outpaces revenue growth, gross margin is compressing.' : 'Falling COGS may reflect efficiency gains or lower volume.',
  netIncome:(chg)=> chg>0 ? 'Higher net income is favorable, but confirm the source: is it operational or one-off (e.g., lower tax rate)?' : 'Declining net income needs root-cause analysis — margin compression, higher interest, or higher tax.',
  totalAssets:(chg)=> chg>0 ? 'Asset growth should be matched by proportionate revenue/profit growth, or asset turnover is deteriorating.' : 'Shrinking asset base may reflect divestment or underinvestment.',
  inventory:(chg)=> chg>0 ? 'Rising inventory can signal expansion, but if faster than sales growth it is potentially inefficient and cash-consuming.' : 'Falling inventory may reflect improved efficiency or a slowdown in future sales.',
  ar:(chg)=> chg>0 ? 'Rising receivables is potentially negative for cash flow if it grows faster than revenue — customers taking longer to pay.' : 'Falling receivables improves near-term cash collection.',
  totalLiabilities:(chg)=> chg>0 ? 'Increase in liabilities/debt is potentially risky, raising fixed obligations and financial risk.' : 'Reduction in liabilities lowers financial risk.',
  equity:(chg)=> chg>0 ? 'Equity growth (via retained earnings or fresh capital) strengthens the balance sheet.' : 'Declining equity may reflect losses or buybacks/dividends exceeding profit.'
};
const HA_BLANK_ROWS = new Set(['cogs','opex','tax']); // rows where % Δ is left blank for students (absolute change always shown)
let HA_REASONS = {};
let HA_ANSWERS = {};
let HA_CHECKED = false;

function hRow(rowKey,label,v1,v2,key){
  const abs = v2-v1, pct = safeDiv(abs,Math.abs(v1)||1)*100;
  const note = HORIZ_INTERPRET[key] ? HORIZ_INTERPRET[key](abs) : '';
  const isBlank = HA_BLANK_ROWS.has(rowKey);
  const absCell = `<span class="${dirClass(abs)}">${dirArrow(abs)} ${fmtCur(Math.abs(abs),1)}</span>`; // absolute change always shown
  let pctCell;
  if(isBlank){
    const savedPct = HA_ANSWERS[rowKey]?.pct ?? '';
    const pctOk = HA_CHECKED ? Math.abs(parseFloat(savedPct)-pct) < 0.6 : null;
    pctCell = `<input type="number" step="any" style="width:70px;${HA_CHECKED?(pctOk?'border-color:#0fae83;background:#e6f8f1;':'border-color:#c0392b;background:#fceceb;'):''}" value="${savedPct}" oninput="HA_ANSWERS['${rowKey}']=Object.assign(HA_ANSWERS['${rowKey}']||{},{pct:this.value})">`;
    if(HA_CHECKED) pctCell += ` <span class="small-note">(ans: ${fmtPct(pct)})</span>`;
  } else {
    pctCell = `<span class="${dirClass(abs)}">${dirArrow(abs)} ${fmtPct(Math.abs(pct))}</span>`;
  }
  const reasonVal = HA_REASONS[rowKey] || '';
  return `<tr><td style="text-align:left;"><input type="text" placeholder="Why did this change?" value="${reasonVal.replace(/"/g,'&quot;')}" style="width:100%;font-size:11.5px;" oninput="HA_REASONS['${rowKey}']=this.value"></td>
    <td style="text-align:left">${label}</td><td>${fmtCur(v1,1)}</td><td>${fmtCur(v2,1)}</td>
    <td>${absCell}</td><td>${pctCell}</td>
    <td style="text-align:left;font-size:11.5px;color:var(--muted);max-width:220px;">${note}</td></tr>`;
}

function renderTransactionScenarios(catKey, heading){

    <p class="lead">Real business decisions rarely move just one ratio. Work through each transaction below, then use the calculator-style box (supports + − × ÷ and brackets, just like a real calculator) to work out the new ratio yourself.</p>
    ${list.map((s,idx)=>`<div class="formula-block">

   12c. CALCULATOR-STYLE PRACTICE BOX
   Students type a formula (+ - * / and brackets) to compute the ratio
   AFTER a transaction's shocks are applied — mirrors a real calculator.

let CALC_BOX_SEQ = 0;
function applyShocksToYear2(shocks){
  const s = {...DATA.year2};
  Object.keys(shocks).forEach(f=>{ s[f] = DATA.year2[f] * (1 + shocks[f]); });
  return s;
}
const FIELD_LABELS = {
  revenue:'Revenue', cogs:'COGS', opex:'Operating Expenses', depreciation:'Depreciation', interest:'Interest Expense',
  cash:'Cash', ar:'Accounts Receivable', inventory:'Inventory', otherCA:'Other Current Assets',
  ppe:'PP&E', otherNCA:'Other Non-current Assets',
  ap:'Accounts Payable', std:'Short-term Debt', otherCL:'Other Current Liabilities',
  ltd:'Long-term Debt', otherNCL:'Other Non-current Liabilities', equity:'Equity',
  shares:'Shares Outstanding', marketPrice:'Market Price/Share', dividends:'Dividends'
};
function assumptionTable(shocks){
  const rows = Object.keys(shocks).map(f=>{
    const before = DATA.year2[f];
    const after = before * (1+shocks[f]);
    const pct = shocks[f]*100;
    return `<tr><td>${FIELD_LABELS[f]||f}</td><td>${fmt(before,1)}</td><td class="${pct>=0?'pos':'neg'}">${pct>=0?'+':''}${fmt(pct,0)}%</td><td>${fmt(after,1)}</td></tr>`;
  }).join('');
  return `<table style="margin:6px 0;font-size:11.8px;"><tr><th>Line Item (Assumption)</th><th>Before (₹)</th><th>Assumed Change</th><th>After (₹)</th></tr>${rows}</table>`;
}
function renderCalcPracticeBox(catKey, practice, idx){
  const before = computeDerived(DATA.year2);
  const afterRaw = applyShocksToYear2(practice.shocks);
  const after = computeDerived(afterRaw);
  const boxId = 'calcbox_' + catKey + '_' + idx + '_' + (CALC_BOX_SEQ++);
  const assumptions = assumptionTable(practice.shocks);

  if(practice.dupont){
    const npmB = safeDiv(before.netIncome,before.revenue), atrB = safeDiv(before.revenue,before.totalAssets), emB = safeDiv(before.totalAssets,before.equity);
    const npmA = safeDiv(after.netIncome,after.revenue), atrA = safeDiv(after.revenue,after.totalAssets), emA = safeDiv(after.totalAssets,after.equity);
    const roeA = npmA*atrA*emA;
    return `<div class="calc-practice">
      <div class="cptitle">🧮 Practice: assuming the line-item changes below, calculate the new ROE using DuPont (Margin × Turnover × Leverage)</div>
      ${assumptions}
      <div class="cphint">Using the After figures: Net Income = ${fmt(after.netIncome,1)}, Revenue = ${fmt(after.revenue,1)}, Total Assets = ${fmt(after.totalAssets,1)}, Equity = ${fmt(after.equity,1)} → New Net Profit Margin ≈ ${fmt(npmA,4)}, New Asset Turnover ≈ ${fmt(atrA,2)}x, New Equity Multiplier ≈ ${fmt(emA,2)}x. (Before ROE was ${fmtPct(npmB*atrB*emB*100)}.)</div>
      <div class="calc-row">
        <input type="text" id="${boxId}" placeholder="e.g. ${fmt(npmA,3)}*${fmt(atrA,2)}*${fmt(emA,2)}">
        <button class="btn small" onclick="checkCalcPractice('${boxId}', ${roeA}, '%')">Check</button>
      </div>
      <div id="${boxId}_res" class="calc-result"></div>
    </div>`;
  }

  const def = RATIOS[practice.cat].find(r=>r.key===practice.key);
  const beforeC = def.calc(before,null), afterC = def.calc(after,before);
  return `<div class="calc-practice">
    <div class="cptitle">🧮 Practice: assuming the line-item changes below, calculate the new <b>${def.name}</b></div>
    ${assumptions}
    <div class="cphint">Formula: ${def.formula} &nbsp;→&nbsp; New Numerator = ${fmt(afterC.num,1)}, New Denominator = ${fmt(afterC.den,1)} &nbsp;|&nbsp; Before value was: ${def.unit==='%'?fmtPct(beforeC.value):def.unit==='x'?fmtX(beforeC.value):def.unit==='days'?fmt(beforeC.value,1)+' days':fmt(beforeC.value,1)}</div>
    <div class="calc-row">
      <input type="text" id="${boxId}" placeholder="Type a formula, e.g. ${fmt(afterC.num,0)}/${fmt(afterC.den,0)}">
      <button class="btn small" onclick="checkCalcPractice('${boxId}', ${afterC.value}, '${def.unit}')">Check</button>
    </div>
    <div id="${boxId}_res" class="calc-result"></div>
  </div>`;
}
function checkCalcPractice(boxId, correctValue, unit){
  const raw = byId(boxId).value;
  const cleaned = raw.replace(/[^0-9+\-*/().\s]/g,'');
  let val;
  try{ val = cleaned.trim()==='' ? NaN : Function('"use strict";return (' + cleaned + ')')(); }
  catch(e){ val = NaN; }
  const unitFmt = v => unit==='%' ? fmtPct(v) : unit==='x' ? fmtX(v) : unit==='days' ? fmt(v,1)+' days' : fmt(v,1);
  const ok = typeof val==='number' && !isNaN(val) && isFinite(val) && Math.abs(val-correctValue) < Math.max(0.05, Math.abs(correctValue)*0.03);
  const box = byId(boxId+'_res');
  if(!box) return;
  box.innerHTML = ok
    ? `<span class="pos">✓ Correct — you calculated ${unitFmt(val)}</span>`
    : `<span class="neg">✗ ${(typeof val!=='number'||isNaN(val))?'That formula could not be evaluated. Use only numbers, + − * / and brackets.':'You got '+unitFmt(val)+'.'} Correct answer: ${unitFmt(correctValue)}</span>`;
}

function runLeverageSim(){
  const d = computeDerived(DATA.year2);

RENDERERS.dupont = function(panel){
  const d1 = computeDerived(DATA.year1), d2 = computeDerived(DATA.year2);
  function dupont(d,p){
    const npm = safeDiv(d.netIncome,d.revenue);
    const avgAssets = p?(p.totalAssets+d.totalAssets)/2:d.totalAssets;
    const avgEquity = p?(p.equity+d.equity)/2:d.equity;
    const atr = safeDiv(d.revenue,avgAssets);
    const em = safeDiv(avgAssets,avgEquity);
    const roe = npm*atr*em;
    return {npm,atr,em,roe};
  }
  const du1 = dupont(d1,null), du2 = dupont(d2,d1);
  const driver = (()=>{
    const dNpm = du2.npm-du1.npm, dAtr=du2.atr-du1.atr, dEm=du2.em-du1.em;
    const mags = [['profit margin',Math.abs(dNpm)*100],['asset turnover',Math.abs(dAtr)*50],['financial leverage',Math.abs(dEm)*30]];
    mags.sort((a,b)=>b[1]-a[1]);
    return mags[0][0];
  })();
  panel.innerHTML = `
  <div class="card">
    <h2>DuPont Analysis</h2>
    <p class="lead">ROE = Net Profit Margin × Asset Turnover × Equity Multiplier (Financial Leverage). This decomposes <i>why</i> ROE is what it is.</p>
    <div class="dupont-box">
      <div class="dbox"><div class="dl">Net Profit Margin</div><div class="dv">${fmtPct(du2.npm*100)}</div></div>
      <div class="op">×</div>
      <div class="dbox"><div class="dl">Asset Turnover</div><div class="dv">${fmtX(du2.atr)}</div></div>
      <div class="op">×</div>
      <div class="dbox"><div class="dl">Equity Multiplier</div><div class="dv">${fmtX(du2.em)}</div></div>
      <div class="op">=</div>
      <div class="dbox" style="border-color:var(--gold);"><div class="dl">ROE</div><div class="dv">${fmtPct(du2.roe*100)}</div></div>
    </div>
    <table>
      <tr><th>Component</th><th>Year 1</th><th>Year 2</th><th>Change</th></tr>
      <tr><td>Net Profit Margin</td><td>${fmtPct(du1.npm*100)}</td><td>${fmtPct(du2.npm*100)}</td><td class="${dirClass(du2.npm-du1.npm)}">${dirArrow(du2.npm-du1.npm)} ${fmtPct(Math.abs(du2.npm-du1.npm)*100)} pts</td></tr>
      <tr><td>Asset Turnover</td><td>${fmtX(du1.atr)}</td><td>${fmtX(du2.atr)}</td><td class="${dirClass(du2.atr-du1.atr)}">${dirArrow(du2.atr-du1.atr)} ${fmtX(Math.abs(du2.atr-du1.atr))}</td></tr>
      <tr><td>Equity Multiplier</td><td>${fmtX(du1.em)}</td><td>${fmtX(du2.em)}</td><td class="${dirClass(du2.em-du1.em)}">${dirArrow(du2.em-du1.em)} ${fmtX(Math.abs(du2.em-du1.em))}</td></tr>
      <tr class="grandtotal"><td>ROE</td><td>${fmtPct(du1.roe*100)}</td><td>${fmtPct(du2.roe*100)}</td><td class="${dirClass(du2.roe-du1.roe)}">${dirArrow(du2.roe-du1.roe)} ${fmtPct(Math.abs(du2.roe-du1.roe)*100)} pts</td></tr>
    </table>
    <div class="callout ${driver==='financial leverage'?'warn':'info'}">💡 The change in ROE from Year 1 to Year 2 is most driven by a change in <b>${driver}</b>. ${driver==='financial leverage' ? 'Since leverage is the main driver, rising ROE here reflects more debt-funded risk, not necessarily better operating performance — inspect debt ratios and interest coverage before concluding the company is "more profitable."' : 'This suggests the change in ROE reflects a genuine operating improvement rather than simply added financial risk.'}</div>
  </div>
  <div class="card">
    <h3>DuPont "What-If" Simulator</h3>
    <div class="grid grid-3">
      <div class="field"><label>Net Profit Margin %</label><input type="number" id="duM" value="${fmt(du2.npm*100,2)}"></div>
      <div class="field"><label>Asset Turnover (x)</label><input type="number" id="duT" value="${fmt(du2.atr,2)}"></div>
      <div class="field"><label>Equity Multiplier (x)</label><input type="number" id="duE" value="${fmt(du2.em,2)}"></div>
    </div>
    <button class="btn" onclick="runDupontSim()">Recalculate ROE</button>
    <div id="duResult" style="margin-top:10px;"></div>
  </div>` + renderTransactionScenarios('dupont','ROE via DuPont');
  drawChart; // no-op placeholder to keep function referenced
};
function runDupontSim(){
  const m = parseFloat(byId('duM').value)/100, t = parseFloat(byId('duT').value), e = parseFloat(byId('duE').value);
  const roe = m*t*e*100;
  byId('duResult').innerHTML = `<div class="formula-block"><div class="fname">Simulated ROE</div>
    <div class="fformula">${fmtPct(m*100)} × ${fmtX(t)} × ${fmtX(e)}</div>
    <div class="fresult">${fmtPct(roe)}</div>
    <div class="finterpret">Ask: is this ROE driven by margin (profitability), turnover (efficiency), or the multiplier (leverage/risk)? The same ROE can come from very different — and not equally safe — combinations.</div></div>`;
}

function round2(n){ return Math.round(n*100)/100; }

function buildPracticeQuestions(){
  const qs = [];
  let id=1;

  // 10 Vertical Analysis questions
  for(let i=0;i<10;i++){
    const rev = 800 + i*120, cogs = Math.round(rev*(0.55+ (i%5)*0.02));
    const gp = rev-cogs, gpm = round2(gp/rev*100);
    qs.push({id:id++, category:'Vertical Analysis',
      scenario:`A company reports Revenue of ₹${rev} lakh and COGS of ₹${cogs} lakh.`,
      question:'Calculate the Gross Profit Margin (%) using vertical analysis (Item / Revenue × 100).',
      answer:gpm, tolerance:0.6, unit:'%',
      explanation:`Gross Profit = ${rev} − ${cogs} = ₹${gp} lakh. Gross Profit Margin = ${gp}/${rev} × 100 = ${gpm}%.`});
  }
  // 10 Horizontal Analysis questions
  for(let i=0;i<10;i++){
    const y1 = 1000 + i*90, y2 = Math.round(y1*(1 + ((i%2===0)? 0.08+i*0.01 : -0.05-i*0.005)));
    const pct = round2((y2-y1)/y1*100);
    qs.push({id:id++, category:'Horizontal Analysis',
      scenario:`Revenue was ₹${y1} lakh in Year 1 and ₹${y2} lakh in Year 2.`,
      question:'Calculate the percentage change in Revenue from Year 1 to Year 2.',
      answer:pct, tolerance:0.6, unit:'%',
      explanation:`% Change = (${y2} − ${y1}) / ${y1} × 100 = ${pct}%. ${pct>=0?'A revenue increase is potentially positive, but check whether margins and cash collection kept pace.':'A revenue decline warrants investigating demand or competitive pressure.'}`});
  }
  // 10 Liquidity questions
  for(let i=0;i<10;i++){
    const ca = 400+i*45, cl = 200+i*22, cash=80+i*8, ar=120+i*10;
    const cr = round2(ca/cl), qr = round2((cash+ar)/cl);
    const askQuick = i%2===1;
    qs.push({id:id++, category:'Liquidity Ratios',
      scenario:`Current Assets ₹${ca} lakh, Current Liabilities ₹${cl} lakh, Cash ₹${cash} lakh, Accounts Receivable ₹${ar} lakh.`,
      question: askQuick ? 'Calculate the Quick Ratio.' : 'Calculate the Current Ratio.',
      answer: askQuick?qr:cr, tolerance:0.05, unit:'x',
      explanation: askQuick ? `Quick Ratio = (Cash + AR) / CL = (${cash}+${ar})/${cl} = ${qr}x.` : `Current Ratio = CA / CL = ${ca}/${cl} = ${cr}x.`});
  }
  // 10 Activity questions
  for(let i=0;i<10;i++){
    const cogs = 1500+i*100, avgInv = 200+i*15, rev=2000+i*130, avgAr=250+i*12;
    const invTurn = round2(cogs/avgInv), dio=round2(365/invTurn);
    const dso = round2(365/(rev/avgAr));
    const askDSO = i%2===1;
    qs.push({id:id++, category:'Activity Ratios',
      scenario: askDSO ? `Revenue ₹${rev} lakh, Average Accounts Receivable ₹${avgAr} lakh.` : `COGS ₹${cogs} lakh, Average Inventory ₹${avgInv} lakh.`,
      question: askDSO ? 'Calculate Days Sales Outstanding (DSO).' : 'Calculate Inventory Turnover, then Days Inventory Outstanding (DIO). Enter DIO.',
      answer: askDSO?dso:dio, tolerance:1.5, unit:'days',
      explanation: askDSO ? `Receivables Turnover = ${rev}/${avgAr} = ${round2(rev/avgAr)}x → DSO = 365/${round2(rev/avgAr)} = ${dso} days.` : `Inventory Turnover = ${cogs}/${avgInv} = ${invTurn}x → DIO = 365/${invTurn} = ${dio} days.`});
  }
  // 10 Capital Structure / Leverage
  for(let i=0;i<10;i++){
    const debt = 600+i*60, equity = 500+i*40, ebit=300+i*25, interest=50+i*6;
    const de = round2(debt/equity), ic = round2(ebit/interest);
    const askIC = i%2===1;
    qs.push({id:id++, category:'Capital Structure / Leverage',
      scenario: askIC ? `EBIT ₹${ebit} lakh, Interest Expense ₹${interest} lakh.` : `Total Debt ₹${debt} lakh, Shareholders' Equity ₹${equity} lakh.`,
      question: askIC ? 'Calculate the Interest Coverage Ratio.' : 'Calculate the Debt-to-Equity Ratio.',
      answer: askIC?ic:de, tolerance:0.05, unit:'x',
      explanation: askIC ? `Interest Coverage = EBIT/Interest = ${ebit}/${interest} = ${ic}x. ${ic<2?'Below 2x is a red flag for debt servicing capacity.':'Comfortable coverage of interest obligations.'}` : `D/E = Debt/Equity = ${debt}/${equity} = ${de}x. ${de>2?'This is a highly leveraged capital structure.':'This is a moderately leveraged capital structure.'}`});
  }
  // 10 Profitability / Valuation
  for(let i=0;i<10;i++){
    const rev=3000+i*150, ni=Math.round(rev*(0.06+(i%4)*0.015)), shares=200+i*15, price=80+i*9;
    const npm = round2(ni/rev*100), eps=round2(ni/shares), pe=round2(price/eps);
    const askPE = i%2===1;
    qs.push({id:id++, category:'Profitability / Valuation',
      scenario: askPE ? `Net Income ₹${ni} lakh, Shares Outstanding ${shares} lakh, Market Price ₹${price}.` : `Revenue ₹${rev} lakh, Net Income ₹${ni} lakh.`,
      question: askPE ? 'Calculate EPS, then the P/E Ratio. Enter the P/E Ratio.' : 'Calculate the Net Profit Margin (%).',
      answer: askPE?pe:npm, tolerance: askPE?0.3:0.6, unit: askPE?'x':'%',
      explanation: askPE ? `EPS = ${ni}/${shares} = ${eps}. P/E = ${price}/${eps} = ${pe}x.` : `Net Profit Margin = ${ni}/${rev} × 100 = ${npm}%.`});
  }
  return qs;
}

function submitQuiz(){
  let correctCount=0;
  PRACTICE_QUESTIONS.forEach(q=>{
    const inputEl = byId('qans-'+q.id);
    const userVal = parseFloat(inputEl.value);
    const isCorrect = !isNaN(userVal) && Math.abs(userVal-q.answer) <= q.tolerance;
    QUIZ_STATE[q.id] = {userAnswer:inputEl.value, correct:isCorrect};
    if(isCorrect) correctCount++;
    const fb = byId('qfeedback-'+q.id);
    fb.className = 'qfeedback show ' + (isCorrect?'correct':'incorrect');
    fb.innerHTML = `${isCorrect?'✓ Correct.':'✗ Not quite. Correct answer: '+q.answer+' '+q.unit+'.'} <br><b>Explanation:</b> ${q.explanation}`;
  });
  QUIZ_STATE.__scored = {correct:correctCount, total:PRACTICE_QUESTIONS.length};
  renderQuizScore();
  if(byId('quizScoreBox').scrollIntoView) byId('quizScoreBox').scrollIntoView({behavior:'smooth'});
}
function renderQuizScore(){
  const s = QUIZ_STATE.__scored;

}

function handleCSVUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const lines = e.target.result.split(/\r?\n/).filter(l=>l.trim().length);
      const headers = lines[0].split(',').map(h=>h.trim());
      const row1 = lines[1] ? lines[1].split(',').map(v=>parseFloat(v)||0) : null;
      const row2 = lines[2] ? lines[2].split(',').map(v=>parseFloat(v)||0) : null;
      if(!row1){ byId('csvStatus').textContent='CSV needs at least one data row.'; return; }
      function applyRow(target,row){ headers.forEach((h,i)=>{ if(h in target) target[h]=row[i]||0; }); }
      applyRow(DATA.year1,row1);
      if(row2) applyRow(DATA.year2,row2); else applyRow(DATA.year2,row1);
      saveToStorage();
      byId('csvStatus').innerHTML = '<span class="pos">✓ CSV imported successfully. Go to Financial Statements to review.</span>';
    }catch(err){
      byId('csvStatus').innerHTML = '<span class="neg">Could not parse this CSV. Check the column headers.</span>';
    }
  };
  reader.readAsText(file);
}
function attemptApiImport(){
  byId('apiStatus').innerHTML = '📌 No API key is hard-coded into this application. Live fetch is a manual, opt-in action requiring your own provider key and (for browser-based calls) a CORS-enabled endpoint. Use CSV import or Manual Mode above for this exercise.';
}

/* Generic CSV download helper — used by per-tab download buttons */
function downloadCSVGeneric(filenameSuffix, rows){
  const csv = rows.map(r=>r.map(c=>{
    c = (c===undefined||c===null) ? '' : String(c);
    if(c.includes(',')||c.includes('"')||c.includes('\n')) c = '"'+c.replace(/"/g,'""')+'"';
    return c;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (DATA.meta.company||'company').replace(/\s+/g,'_')+'_'+filenameSuffix+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function downloadCompetitorCSV(){
  const own = computeDerived(DATA.year2);
  const comps = {Own:{name:DATA.meta.company, d:own}};
  Object.keys(COMPETITORS).forEach(k=>{ comps[k] = {name:COMPETITORS[k].name, d:computeDerived(COMPETITORS[k].data)}; });
  const compareSet = [
    ['liquidity','current'], ['liquidity','quick'], ['activity','invturn'], ['activity','dso'],
    ['capstructure','de'], ['leverage','intcov'], ['profitability','npm'], ['profitability','roe'],
    ['valuation','pe']
  ];
  const rows = [
    ['COMPETITOR ANALYSIS —', DATA.meta.company],
    [],
    ['Ratio', ...Object.keys(comps).map(k=>comps[k].name), 'Best Performer', 'Worst Performer']
  ];
  compareSet.forEach(([cat,key])=>{
    const def = RATIOS[cat].find(r=>r.key===key);
    const vals = {};
    Object.keys(comps).forEach(k=> vals[k] = def.calc(comps[k].d,null).value );
    const entries = Object.entries(vals).filter(([k,v])=>!isNaN(v));
    const lower = LOWER_IS_BETTER.has(key);
    const best = entries.length ? entries.reduce((a,b)=> (lower ? (b[1]<a[1]?b:a) : (b[1]>a[1]?b:a)) )[0] : '—';
    const worst = entries.length ? entries.reduce((a,b)=> (lower ? (b[1]>a[1]?b:a) : (b[1]<a[1]?b:a)) )[0] : '—';
    const unitFmt = v => def.unit==='%' ? fmtPct(v) : def.unit==='x' ? fmtX(v) : def.unit==='days' ? fmt(v,1) : fmt(v,1);
    rows.push([def.name+(lower?' (lower is better)':''), ...Object.keys(comps).map(k=>unitFmt(vals[k])), comps[best]?comps[best].name:'—', comps[worst]?comps[worst].name:'—']);
  });
  downloadCSVGeneric('competitor_analysis', rows);
}

      <tr class="sub"><td>Shareholders' Equity</td><td>${fmtCur(d1.equity,1)}</td><td>${fmtCur(d2.equity,1)}</td></tr>
      <tr><td>Long-term Debt</td><td>${fmtCur(d1.ltd,1)}</td><td>${fmtCur(d2.ltd,1)}</td></tr>
      <tr><td>Other Non-current Liabilities</td><td>${fmtCur(d1.otherNCL,1)}</td><td>${fmtCur(d2.otherNCL,1)}</td></tr>
      <tr class="sub"><td>Total Non-current Liabilities</td><td>${fmtCur(d1.totalNonCurrentLiabilities,1)}</td><td>${fmtCur(d2.totalNonCurrentLiabilities,1)}</td></tr>
      <tr><td>Accounts Payable</td><td>${fmtCur(d1.ap,1)}</td><td>${fmtCur(d2.ap,1)}</td></tr>
      <tr><td>Short-term Debt</td><td>${fmtCur(d1.std,1)}</td><td>${fmtCur(d2.std,1)}</td></tr>
      <tr><td>Other Current Liabilities</td><td>${fmtCur(d1.otherCL,1)}</td><td>${fmtCur(d2.otherCL,1)}</td></tr>
      <tr class="sub"><td>Total Current Liabilities</td><td>${fmtCur(d1.totalCurrentLiabilities,1)}</td><td>${fmtCur(d2.totalCurrentLiabilities,1)}</td></tr>
      <tr class="grand"><td>TOTAL EQUITY &amp; LIABILITIES</td><td>${fmtCur(d1.totalLiabilities+d1.equity,1)}</td><td>${fmtCur(d2.totalLiabilities+d2.equity,1)}</td></tr>
    </table>
    </div>
    <p class="note">Balance Check — Year 1: ${d1.balanced?'<span class="good">BALANCED ✓</span>':'<span class="risk">NOT BALANCED</span>'} &nbsp;|&nbsp; Year 2: ${d2.balanced?'<span class="good">BALANCED ✓</span>':'<span class="risk">NOT BALANCED</span>'}</p>`;
  }

  function vertBlock(){
    function row(label,k1,k2,base1,base2,rowKey){
      const v1=safeDiv(k1,base1)*100, v2=safeDiv(k2,base2)*100;
      const reason = VA_REASONS[rowKey]||'';
      return `<tr><td>${reason}</td><td>${label}</td><td>${fmtCur(k1,1)}</td><td>${fmtPct(v1)}</td><td>${fmtCur(k2,1)}</td><td>${fmtPct(v2)}</td></tr>`;
    }
    return `<h2>2. Vertical (Common-Size) Analysis</h2>
    <table><tr><th>Reason for Change</th><th>Item</th><th>Y1 ₹</th><th>Y1 %</th><th>Y2 ₹</th><th>Y2 %</th></tr>
      ${row('Revenue',d1.revenue,d2.revenue,d1.revenue,d2.revenue,'revenue')}
      ${row('COGS',d1.cogs,d2.cogs,d1.revenue,d2.revenue,'cogs')}
      ${row('Gross Profit',d1.grossProfit,d2.grossProfit,d1.revenue,d2.revenue,'grossProfit')}
      ${row('Operating Expenses',d1.opex,d2.opex,d1.revenue,d2.revenue,'opex')}
      ${row('EBITDA',d1.ebitda,d2.ebitda,d1.revenue,d2.revenue,'ebitda')}
      ${row('EBIT',d1.ebit,d2.ebit,d1.revenue,d2.revenue,'ebit')}
      ${row('Net Income',d1.netIncome,d2.netIncome,d1.revenue,d2.revenue,'netIncome')}
      ${row('Cash',d1.cash,d2.cash,d1.totalAssets,d2.totalAssets,'cash')}
      ${row('Inventory',d1.inventory,d2.inventory,d1.totalAssets,d2.totalAssets,'inventory')}
      ${row('Total Assets',d1.totalAssets,d2.totalAssets,d1.totalAssets,d2.totalAssets,'totalAssets')}
      ${row('Total Liabilities',d1.totalLiabilities,d2.totalLiabilities,d1.totalAssets,d2.totalAssets,'totalLiab')}
      ${row('Equity',d1.equity,d2.equity,d1.totalAssets,d2.totalAssets,'equity')}
    </table>`;
  }

  function horizBlock(){
    function row(label,v1,v2,rowKey){
      const abs=v2-v1, pct=safeDiv(abs,Math.abs(v1)||1)*100;
      const reason = HA_REASONS[rowKey]||'';
      return `<tr><td>${reason}</td><td>${label}</td><td>${fmtCur(v1,1)}</td><td>${fmtCur(v2,1)}</td><td>${fmt(abs,1)}</td><td>${fmtPct(pct)}</td></tr>`;
    }
    return `<h2>3. Horizontal (Trend) Analysis</h2>
    <table><tr><th>Reason for Change</th><th>Item</th><th>Year 1</th><th>Year 2</th><th>Abs Δ</th><th>% Δ</th></tr>
      ${row('Revenue',d1.revenue,d2.revenue,'revenue')}
      ${row('COGS',d1.cogs,d2.cogs,'cogs')}
      ${row('Net Income',d1.netIncome,d2.netIncome,'netIncome')}
      ${row('Total Assets',d1.totalAssets,d2.totalAssets,'totalAssets')}
      ${row('Total Liabilities',d1.totalLiabilities,d2.totalLiabilities,'totalLiabilities')}
      ${row('Equity',d1.equity,d2.equity,'equity')}
    </table>`;
  }

  function ratioBlock(catKey,num){
    const defs = RATIOS[catKey];
    let rows = defs.map(r=>{
      const c1=r.calc(d1,null), c2=r.calc(d2,d1);
      const unitFmt = v => r.unit==='%' ? fmtPct(v) : r.unit==='x' ? fmtX(v) : r.unit==='days' ? fmt(v,1)+' d' : fmt(v,1);
      return `<tr><td>${r.name}</td><td class="formula">${r.formula}</td><td>${unitFmt(c1.value)}</td><td>${unitFmt(c2.value)}</td><td>${r.interpret(c2.value,d2)}</td></tr>`;
    }).join('');
    return `<h2>${num}. ${RATIO_CATEGORY_LABEL[catKey]}</h2>
    <table><tr><th>Ratio</th><th>Formula</th><th>Year 1</th><th>Year 2</th><th>Interpretation</th></tr>${rows}</table>`;
  }

  function dupontBlock(){
    function dp(d,p){
      const npm=safeDiv(d.netIncome,d.revenue); const avgA=p?(p.totalAssets+d.totalAssets)/2:d.totalAssets; const avgE=p?(p.equity+d.equity)/2:d.equity;
      const atr=safeDiv(d.revenue,avgA), em=safeDiv(avgA,avgE); return {npm,atr,em,roe:npm*atr*em};
    }
    const du1=dp(d1,null), du2=dp(d2,d1);
    return `<h2>9. DuPont Analysis</h2>
    <table><tr><th>Component</th><th>Year 1</th><th>Year 2</th></tr>
      <tr><td>Net Profit Margin</td><td>${fmtPct(du1.npm*100)}</td><td>${fmtPct(du2.npm*100)}</td></tr>
      <tr><td>Asset Turnover</td><td>${fmtX(du1.atr)}</td><td>${fmtX(du2.atr)}</td></tr>
      <tr><td>Equity Multiplier</td><td>${fmtX(du1.em)}</td><td>${fmtX(du2.em)}</td></tr>
      <tr class="grand"><td>ROE</td><td>${fmtPct(du1.roe*100)}</td><td>${fmtPct(du2.roe*100)}</td></tr>
    </table>`;
  }

  function competitorBlock(){
    const own = d2;
    const comps = {Own:{name:DATA.meta.company,d:own}};
    Object.keys(COMPETITORS).forEach(k=>{comps[k]={name:COMPETITORS[k].name,d:computeDerived(COMPETITORS[k].data)};});
    const compareSet = [['liquidity','current'],['activity','dso'],['capstructure','de'],['profitability','roe'],['valuation','pe']];
    let rows = compareSet.map(([cat,key])=>{
      const def = RATIOS[cat].find(r=>r.key===key);
      const unitFmt=v=>def.unit==='%'?fmtPct(v):def.unit==='x'?fmtX(v):def.unit==='days'?fmt(v,1):fmt(v,1);
      return `<tr><td>${def.name}</td>${Object.keys(comps).map(k=>`<td>${unitFmt(def.calc(comps[k].d,null).value)}</td>`).join('')}</tr>`;
    }).join('');
    return `<h2>10. Competitor Analysis</h2>
    <table><tr><th>Ratio</th>${Object.keys(comps).map(k=>`<th>${comps[k].name}</th>`).join('')}</tr>${rows}</table>`;
  }

  const practiceBlock = score ? `<h2>11. Practice Lab Result</h2><p>Score: <b>${score.correct} / ${score.total}</b> (${round2(score.correct/score.total*100)}%)</p>` : '';

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${DATA.meta.company} — Complete Financial Analysis Report</title>
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;color:#1b2534;margin:0;background:#f4f6f9;}
    .page{max-width:1000px;margin:0 auto;padding:30px;background:#fff;}
    .coverbar{background:linear-gradient(135deg,#0b1f3a,#132c52);color:#fff;padding:26px 30px;border-radius:12px;display:flex;align-items:center;gap:18px;margin-bottom:22px;}
    .coverbar h1{margin:0;font-size:22px;}
    .coverbar .sub{color:#c99a2e;font-size:13px;margin-top:4px;font-weight:700;}
    .recbox{background:#eaf1ff;border:1px solid #c7dcff;border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:13px;}
    h2{color:#0b1f3a;border-bottom:3px solid #c99a2e;padding-bottom:6px;margin-top:34px;font-size:18px;}
    table{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:12.5px;}
    th{background:#eaf1ff;color:#0b1f3a;padding:7px 9px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;}
    td{padding:6px 9px;border-bottom:1px solid #e2e6ec;}
    tr.sub td{font-weight:700;background:#f7f9fd;}
    tr.grand td{font-weight:800;background:#eaf1ff;border-top:2px solid #0b1f3a;}
    td.formula{font-family:'Courier New',monospace;color:#2563eb;font-size:11px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .good{color:#0fae83;font-weight:700;} .risk{color:#c0392b;font-weight:700;}
    .note{font-size:12px;color:#5b6b82;}
    .footer{text-align:center;color:#5b6b82;font-size:11px;margin-top:40px;padding-top:16px;border-top:1px solid #e2e6ec;}
    @media print{ body{background:#fff;} .page{padding:0;} }
  </style></head>
  <body><div class="page">
    <div class="coverbar">
      ${comandfinLogoSVG(56)}
      <div>
        <h1>Financial Statement Analysis &amp; Ratio Analysis — Complete Report</h1>
        <div class="sub">COMandFIN EDUTECH</div>
      </div>
    </div>
    <div class="recbox">
      <b>Company:</b> ${DATA.meta.company} &nbsp; | &nbsp; <b>Student:</b> ${rec.student||'—'} &nbsp; | &nbsp; <b>Student ID:</b> ${rec.id||'—'}<br>
      <b>Course:</b> ${rec.course||'—'} &nbsp; | &nbsp; <b>Instructor:</b> ${rec.instructor||'—'} &nbsp; | &nbsp; <b>Date:</b> ${new Date().toLocaleDateString()}
    </div>
    ${statBlock()}
    ${vertBlock()}
    ${horizBlock()}
    ${ratioBlock('liquidity',4)}
    ${ratioBlock('activity',5)}
    ${ratioBlock('capstructure',6)}
    ${ratioBlock('leverage',7)}
    ${ratioBlock('profitability',8)}
    ${dupontBlock()}
    ${ratioBlock('valuation',10)}
    ${competitorBlock()}
    ${practiceBlock}
    <div class="footer">Generated by the COMandFIN Financial Statement Analysis &amp; Ratio Analysis Learning Lab · ${new Date().toLocaleString()}</div>
  </div></body></html>`;
}

function downloadFullReport(){
  const html = generateFullReportHTML();
  const blob = new Blob([html],{type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (DATA.meta.company||'company').replace(/\s+/g,'_')+'_Complete_Report.html';
  document.body.appendChild(a); a.click(); a.remove();
}

function downloadCSV(){
  const d1 = computeDerived(DATA.year1), d2 = computeDerived(DATA.year2);
  const rows = [['Item','Year1','Year2']];
  ['revenue','cogs','grossProfit','opex','ebit','interest','pbt','tax','netIncome','totalCurrentAssets','totalAssets','totalCurrentLiabilities','totalLiabilities','equity','eps'].forEach(k=>{
    rows.push([k, d1[k], d2[k]]);
  });
  const csv = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (DATA.meta.company||'company').replace(/\s+/g,'_')+'_financials.csv';
  a.click();
}

KEY RATIOS (Year 2)

/* ---------------------------------------------------------------------
   21. TEACHER / STUDENT MODE
--------------------------------------------------------------------- */
function setMode(m){
  if(m==='teacher' && MODE!=='teacher'){
    const pin = prompt('Enter classroom PIN to enable Teacher Mode (this is a classroom convenience, not secure authentication):');
    if(pin !== '1234'){ alert('Incorrect PIN.'); return; }
  }
  MODE = m;
  byId('btnStudentMode').classList.toggle('active', m==='student');
  byId('btnTeacherMode').classList.toggle('active', m==='teacher');
  switchTab(CURRENT_TAB);
}

/* ---------------------------------------------------------------------
   22. RESET FUNCTIONS
--------------------------------------------------------------------- */
function resetScope(scope){
  if(!confirm('This will permanently reset '+scope+' data. Continue?')) return;
  if(scope==='company'){ DATA.year1=blankYear(); DATA.year2=blankYear(); DATA.meta.company='My Company'; VA_REASONS={}; VA_ANSWERS={}; VA_CHECKED=false; HA_REASONS={}; HA_ANSWERS={}; HA_CHECKED=false; }
  if(scope==='simulation'){ SIM = {...DATA.year2}; }
  if(scope==='practice'){ QUIZ_STATE = {}; }
  if(scope==='all'){ DATA={meta:{company:'My Company',currency:'₹ Lakh'},year1:blankYear(),year2:blankYear()}; COMPETITORS={A:{name:'Company A',data:blankYear()},B:{name:'Company B',data:blankYear()},C:{name:'Company C',data:blankYear()}}; SIM=null; QUIZ_STATE={}; VA_REASONS={}; VA_ANSWERS={}; VA_CHECKED=false; HA_REASONS={}; HA_ANSWERS={}; HA_CHECKED=false; localStorage.clear(); }
  saveToStorage();
  switchTab(CURRENT_TAB);
}

/* ---------------------------------------------------------------------
   23. INIT
--------------------------------------------------------------------- */
function init(){
  loadFromStorage();
  if(!SIM) SIM = {...DATA.year2};
  buildNav();
  byId('btnStudentMode').onclick = ()=>setMode('student');
  byId('btnTeacherMode').onclick = ()=>setMode('teacher');
  ['recStudent','recId','recCourse','recInstructor'].forEach(id=> byId(id).addEventListener('change', saveToStorage));
  // if truly empty, preload the Stable example so the app is not blank on first run
  if(DATA.year1.revenue===0 && DATA.year2.revenue===0){
    loadExample('stable');
  } else {
    switchTab('dashboard');
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
